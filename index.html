<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>AVIA</title>

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#040812">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #040812;
            color: #fff;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
        }

        /* ИКОНКА AVIA */

        .logo {
            width: 155px;
            height: 155px;

            margin: 0 auto 25px;

            border-radius: 40px;
            overflow: hidden;

            background: #06142b;

            box-shadow:
                0 20px 70px rgba(40, 140, 255, .30);
        }

        .logo svg {
            display: block;

            width: 100%;
            height: 100%;
        }

        h1 {
            margin: 0;

            font-size: 42px;
            line-height: 1;

            letter-spacing: -2px;
        }

        .subtitle {
            margin-top: 9px;

            color: #9ca3af;

            font-size: 14px;
        }

        .studio {
            margin-top: 8px;

            color: #5da9ff;

            font-size: 9px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .card {
            margin-top: 25px;

            padding: 22px;

            border-radius: 18px;

            background: rgba(255, 255, 255, .035);

            border: 1px solid rgba(255, 255, 255, .08);
        }

        .card h2 {
            margin: 0 0 10px;

            font-size: 16px;
        }

        .card p {
            margin: 0 0 18px;

            color: #8b93a1;

            font-size: 11px;
        }

        #install {
            width: 100%;

            padding: 14px;

            border: 0;
            border-radius: 13px;

            background: #1675ed;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(22, 117, 237, .30);
        }

        #install:active {
            transform: scale(.98);
        }

        #status {
            margin-top: 12px;

            color: #777f8e;

            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- ПТИЧКА РИСУЕТСЯ ПРЯМО КОДОМ -->

    <div class="logo">

        <svg
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <linearGradient
                    id="body"
                    x1="0"
                    y1="0"
                    x2="0.8"
                    y2="1"
                >

                        offset="0"
                        stop-color="#ffffff"
                    />

                    <stop
                        offset=".65"
                        stop-color="#e8f5ff"
                    />

                    <stop
                        offset="1"
                        stop-color="#a8d8ff"
                    />
                </linearGradient>

                <linearGradient
                    id="wing"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1"
                >
                    <stop
                        offset="0"
                        stop-color="#ffffff"
                    />

                    <stop
                        offset=".55"
                        stop-color="#d8edff"
                    />

                    <stop
                        offset="1"
                        stop-color="#75baff"
                    />
                </linearGradient>

                <linearGradient
                    id="blueWing"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1"
                >
                    <stop
                        offset="0"
                        stop-color="#8bd5ff"
                    />

                    <stop
                        offset=".55"
                        stop-color="#4ca9ff"
                    />

                    <stop
                        offset="1"
                        stop-color="#1675ed"
                    />
                </linearGradient>

            </defs>

            <!-- ТЁМНЫЙ ФОН -->

            <rect
                width="512"
                height="512"
                rx="105"
                fill="#07152d"
            />

            <!-- МЯГКОЕ СВЕЧЕНИЕ -->

            <ellipse
                cx="245"
                cy="100"
                rx="175"
                ry="70"
                fill="#10274c"
                opacity=".35"
            />

            <!-- НИЖНЯЯ СИНЯЯ ЧАСТЬ -->

            <path
                d="
                    M250 300
                    C215 325 174 350 145 381
                    C121 406 108 430 103 453
                    C137 431 170 414 205 405
                    C242 396 274 382 302 363
                    Z
                "
                fill="url(#blueWing)"
            />

            <!-- БОЛЬШОЕ ВЕРХНЕЕ КРЫЛО -->

            <path
                d="
                    M279 267
                    C299 238 306 207 291 180
                    C271 143 232 124 190 111
                    C150 99 119 82 86 58
                    C87 103 98 143 122 175
                    C151 214 193 235 236 249
                    C255 255 270 261 279 267
                    Z
                "
                fill="url(#wing)"
            />

            <!-- СИНЕЕ КРЫЛО -->

            <path
                d="
                    M89 183
                    C126 201 165 213 208 225
                    C248 236 276 251 286 272
                    C272 293 246 307 216 311
                    C175 306 136 288 109 262
                    C92 245 80 216 89 183
                    Z
                "
                fill="url(#blueWing)"
            />

            <!-- ТЕЛО ПТИЦЫ -->

            <path
                d="
                    M283 248
                    C295 203 318 166 350 153
                    C379 141 403 151 424 168
                    C440 181 455 187 474 190
                    C452 204 430 211 416 229
                    C402 247 398 277 388 307
                    C375 346 350 371 314 385
                    C282 398 247 398 211 407
                    C232 386 253 365 272 344
                    C293 320 305 286 283 248
                    Z
                "
                fill="url(#body)"
            />

            <!-- ГОЛОВА -->

            <path
                d="
                    M347 153
                    C369 141 393 149 414 166
                    C432 180 452 187 474 190
                    C452 202 431 207 414 220
                    C402 199 383 186 360 182
                    Z
                "
                fill="#f7fbff"
            />

            <!-- КЛЮВ -->

            <path
                d="
                    M421 170
                    C441 181 457 187 474 190
                    C456 199 441 201 425 198
                    Z
                "
                fill="#eaf6ff"
            />

            <!-- ГЛАЗ -->

            <circle
                cx="397"
                cy="183"
                r="12"
                fill="#07152d"
            />

            <circle
                cx="401"
                cy="179"
                r="3"
                fill="#ffffff"
            />

        </svg>

    </div>


    <h1>AVIA</h1>

    <div class="subtitle">
        Умная нейросеть
    </div>

    <div class="studio">
        CATS DEVELOPER STUDIO
    </div>


    <div class="card">

        <h2>
            Добро пожаловать в AVIA
        </h2>

        <p>
            Установи AVIA на главный экран как приложение.
        </p>

        <button id="install">
            Установить AVIA
        </button>

        <div id="status"></div>

    </div>

</div>


<script>

let deferredPrompt = null;

const installButton =
    document.getElementById("install");

const status =
    document.getElementById("status");


/* Chrome сообщает,
   когда PWA готова к установке */

window.addEventListener(
    "beforeinstallprompt",
    (event) => {

        event.preventDefault();

        deferredPrompt = event;

        installButton.style.display = "block";

        status.textContent =
            "AVIA готова к установке.";

    }
);


/* НАСТОЯЩАЯ КНОПКА УСТАНОВКИ */

installButton.addEventListener(
    "click",
    async () => {

        if (!deferredPrompt) {

            status.textContent =
                "Chrome пока не подготовил установку. Открой меню ⋮ и выбери «Установить приложение».";

            return;
        }

        deferredPrompt.prompt();

        const result =
            await deferredPrompt.userChoice;

        if (result.outcome === "accepted") {

            installButton.textContent =
                "AVIA установлена ✓";

            status.textContent =
                "AVIA установлена на телефон.";

        } else {

            status.textContent =
                "Установка отменена.";

        }

        deferredPrompt = null;

    }
);


/* AVIA установлена */

window.addEventListener(
    "appinstalled",
    () => {

        installButton.textContent =
            "AVIA установлена ✓";

        status.textContent =
            "Приложение установлено.";

    }
);


/* Service Worker */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "./sw.js"
            );

        }
    );

}

</script>

</body>
</html>
