<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#06101f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ИКОНКА AVIA -->
    <link
        rel="icon"
        href="./icon.png?v=10"
        type="image/png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon.png?v=10"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json?v=10"
    >

    <title>AVIA</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #040812;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        #app {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(30, 120, 255, 0.20),
                    transparent 38%
                ),
                #040812;
        }

        .screen {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                25px
                20px
                calc(25px + env(safe-area-inset-bottom));

            text-align: center;
        }

        .content {
            width: 100%;
            max-width: 390px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ИКОНКА */

        .icon {
            width: 140px;
            height: 140px;

            border-radius: 38px;

            overflow: hidden;

            background: #071426;

            border: 1px solid rgba(255,255,255,.12);

            box-shadow:
                0 25px 80px rgba(0, 110, 255, .30),
                0 0 55px rgba(0, 120, 255, .15);
        }

        .icon img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        /* AVIA */

        h1 {
            margin: 24px 0 0;

            font-size: 43px;
            line-height: 1;

            font-weight: 850;

            letter-spacing: 6px;
        }

        .subtitle {
            margin-top: 10px;

            color: #8d9db4;

            font-size: 16px;
        }

        .studio {
            margin-top: 7px;

            color: #53637a;

            font-size: 10px;

            letter-spacing: 1.5px;
        }

        /* КАРТОЧКА */

        .card {
            width: 100%;

            margin-top: 32px;

            padding: 19px;

            border-radius: 23px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
        }

        .card-text {
            margin-top: 7px;

            color: #728198;

            font-size: 12px;

            line-height: 1.5;
        }

        /* КНОПКА */

        #installButton {
            width: 100%;

            min-height: 57px;

            margin-top: 17px;

            border: none;
            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #318cff,
                    #1760d9
                );

            color: white;

            font-size: 15px;
            font-weight: 750;

            box-shadow:
                0 12px 35px rgba(30, 115, 245, .28);
        }

        #installButton:active {
            transform: scale(.97);
        }

        .hidden {
            display: none !important;
        }

        .status {
            margin-top: 13px;

            color: #53627a;

            font-size: 10px;
        }

        .installed {
            color: #4bd995;
        }

        .footer {
            position: absolute;

            left: 0;
            right: 0;

            bottom:
                calc(
                    15px +
                    env(safe-area-inset-bottom)
                );

            text-align: center;

            color: #3c4859;

            font-size: 9px;

            letter-spacing: 1px;
        }

        @media (max-height: 650px) {

            .icon {
                width: 100px;
                height: 100px;

                border-radius: 28px;
            }

            h1 {
                margin-top: 17px;
                font-size: 33px;
            }

            .card {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <main class="screen">

        <div class="content">

            <!-- ТВОЯ ПТИЧКА -->
            <div class="icon">
                <img
                    src="./icon.png?v=10"
                    alt="AVIA"
                >
            </div>

            <h1>AVIA</h1>

            <div class="subtitle">
                Умная нейросеть
            </div>

            <div class="studio">
                CATS DEVELOPER STUDIO
            </div>

            <div class="card">

                <div class="card-title">
                    Добро пожаловать в AVIA
                </div>

                <div class="card-text">
                    Новый AI-проект от
                    Cats Developer Studio.
                </div>

                <button
                    id="installButton"
                    class="hidden"
                >
                    Установить AVIA
                </button>

                <div
                    id="status"
                    class="status"
                >
                    Проверка установки...
                </div>

            </div>

        </div>

    </main>

    <div class="footer">
        CATS DEVELOPER STUDIO • AVIA
    </div>

</div>


<script>

"use strict";

let deferredPrompt = null;

const installButton =
    document.getElementById(
        "installButton"
    );

const status =
    document.getElementById(
        "status"
    );


/* =========================
   УСТАНОВКА PWA
========================= */

window.addEventListener(
    "beforeinstallprompt",
    function(event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.classList.remove(
            "hidden"
        );

        status.textContent =
            "AVIA готова к установке";

    }
);


/* =========================
   КНОПКА УСТАНОВКИ
========================= */

installButton.addEventListener(
    "click",
    async function() {

        if (!deferredPrompt) {

            alert(
                "Открой меню Chrome и выбери «Установить приложение»."
            );

            return;
        }

        deferredPrompt.prompt();

        const result =
            await deferredPrompt.userChoice;

        if (
            result.outcome === "accepted"
        ) {

            status.textContent =
                "AVIA устанавливается...";

        }

        deferredPrompt = null;

        installButton.classList.add(
            "hidden"
        );
    }
);


/* =========================
   ПРИЛОЖЕНИЕ УСТАНОВЛЕНО
========================= */

window.addEventListener(
    "appinstalled",
    function() {

        installButton.classList.add(
            "hidden"
        );

        status.textContent =
            "AVIA установлена";

        status.classList.add(
            "installed"
        );

    }
);


/* =========================
   SERVICE WORKER
========================= */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "./sw.js?v=10"
                )
                .then(function() {

                    console.log(
                        "AVIA PWA готова"
                    );

                })
                .catch(function(error) {

                    console.error(
                        "SW error:",
                        error
                    );

                });

        }
    );
}


/* =========================
   ПРОВЕРКА STANDALONE
========================= */

if (
    window.matchMedia(
        "(display-mode: standalone)"
    ).matches
) {

    status.textContent =
        "AVIA запущена как приложение";

    status.classList.add(
        "installed"
    );

}

</script>

</body>
</html>
