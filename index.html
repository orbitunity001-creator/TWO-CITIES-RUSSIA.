<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <meta name="theme-color" content="#0878ed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">

    <title>Nexgram</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #061329;
        }

        .page {
            width: 100%;
            height: 100dvh;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(0, 137, 255, .30),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 15% 85%,
                    rgba(0, 74, 190, .28),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 10%,
                    rgba(0, 190, 255, .18),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #020a18,
                    #071b3a 50%,
                    #020914
                );
        }

        /* =========================
           ФОНОВЫЕ СВЕЧЕНИЯ
        ========================= */

        .glow {
            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(70px);

            pointer-events: none;

            opacity: .45;
        }

        .glow.one {
            background: #008cff;

            top: 15%;
            left: -150px;
        }

        .glow.two {
            background: #005de0;

            bottom: -150px;
            right: -100px;
        }

        /* =========================
           INSTALL
        ========================= */

        .top {
            width: 100%;

            padding:
                14px
                15px
                0;

            display: flex;
            justify-content: flex-end;

            position: relative;
            z-index: 20;
        }

        #installButton {
            display: none;

            border: 0;
            outline: none;

            padding:
                12px
                17px;

            border-radius: 16px;

            color: white;

            font-size: 13px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #20a1ff,
                    #0868df
                );

            box-shadow:
                0 8px 25px
                rgba(0, 126, 255, .35);

            cursor: pointer;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        #installButton:active {
            transform: scale(.94);

            box-shadow:
                0 4px 14px
                rgba(0, 126, 255, .25);
        }

        /* =========================
           ЦЕНТР
        ========================= */

        .center {
            width: 100%;

            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 5;

            padding-bottom: 30px;
        }

        /* =========================
           AVATAR
        ========================= */

        .avatar-wrap {
            position: relative;

            width: min(72vw, 310px);
            height: min(72vw, 310px);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-glow {
            position: absolute;

            width: 88%;
            height: 88%;

            border-radius: 50%;

            background:
                rgba(0, 139, 255, .45);

            filter: blur(35px);

            animation:
                glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(.95);
                opacity: .65;
            }

            50% {
                transform: scale(1.06);
                opacity: .9;
            }
        }

        .avatar {
            width: 100%;
            height: 100%;

            position: relative;

            border-radius: 50%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #37b6ff,
                    #087bea 45%,
                    #03459f 100%
                );

            border:
                3px solid
                rgba(255,255,255,.16);

            box-shadow:
                0 0 0 9px
                rgba(12, 139, 255, .08),

                0 25px 70px
                rgba(0, 0, 0, .55),

                inset 0 0 40px
                rgba(0, 42, 120, .45);
        }

        /* Свет внутри круга */

        .avatar::before {
            content: "";

            position: absolute;

            width: 65%;
            height: 65%;

            top: -25%;
            left: -12%;

            border-radius: 50%;

            background:
                rgba(255,255,255,.17);

            filter: blur(15px);
        }

        /* =========================
           КОТИК
        ========================= */

        .cat {
            position: absolute;

            left: 50%;
            bottom: -1%;

            width: 76%;
            height: 72%;

            transform:
                translateX(-50%);

            filter:
                drop-shadow(
                    0 15px 15px
                    rgba(0,0,0,.35)
                );
        }

        /* голова */

        .head {
            position: absolute;

            left: 50%;
            top: 18%;

            width: 70%;
            height: 65%;

            transform:
                translateX(-50%);

            border-radius:
                48%
                48%
                45%
                45%;

            background:
                radial-gradient(
                    circle at 36% 30%,
                    #ffe0a0 0%,
                    #ffc45b 28%,
                    #ed941d 70%,
                    #bd6810 100%
                );

            box-shadow:
                inset
                -14px -14px 25px
                rgba(116,53,0,.22);
        }

        /* левое ухо */

        .ear-left {
            position: absolute;

            left: 8%;
            top: 2%;

            width: 36%;
            height: 35%;

            background:
                linear-gradient(
                    145deg,
                    #ffc45b,
                    #d87d16
                );

            clip-path:
                polygon(
                    5% 100%,
                    28% 5%,
                    100% 88%
                );

            transform: rotate(-4deg);
        }

        /* правое ухо */

        .ear-right {
            position: absolute;

            right: 8%;
            top: 2%;

            width: 36%;
            height: 35%;

            background:
                linear-gradient(
                    215deg,
                    #ffc45b,
                    #d87d16
                );

            clip-path:
                polygon(
                    0 88%,
                    72% 5%,
                    95% 100%
                );

            transform: rotate(4deg);
        }

        /* внутренняя часть ушей */

        .ear-inner-left {
            position: absolute;

            left: 18%;
            top: 9%;

            width: 19%;
            height: 20%;

            background: #f08078;

            clip-path:
                polygon(
                    8% 100%,
                    30% 15%,
                    100% 85%
                );
        }

        .ear-inner-right {
            position: absolute;

            right: 18%;
            top: 9%;

            width: 19%;
            height: 20%;

            background: #f08078;

            clip-path:
                polygon(
                    0 85%,
                    70% 15%,
                    92% 100%
                );
        }

        /* глаза */

        .eye {
            position: absolute;

            top: 43%;

            width: 17%;
            height: 20%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #8bdcff 0%,
                    #18a7ff 38%,
                    #0758a8 100%
                );

            border:
                2px solid
                rgba(30, 70, 100, .7);

            box-shadow:
                0 0 12px
                rgba(0,190,255,.45);
        }

        .eye.left {
            left: 22%;
        }

        .eye.right {
            right: 22%;
        }

        .eye::before {
            content: "";

            position: absolute;

            left: 50%;
            top: 14%;

            transform:
                translateX(-50%);

            width: 40%;
            height: 70%;

            border-radius: 50%;

            background: #061322;
        }

        .eye::after {
            content: "";

            position: absolute;

            width: 25%;
            height: 25%;

            left: 23%;
            top: 16%;

            border-radius: 50%;

            background: white;
        }

        /* мордочка */

        .muzzle {
            position: absolute;

            left: 50%;
            top: 63%;

            transform:
                translateX(-50%);

            width: 45%;
            height: 27%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #ffe7bc,
                    #f6bd68
                );
        }

        .nose {
            position: absolute;

            left: 50%;
            top: 70%;

            transform:
                translateX(-50%);

            width: 9%;
            height: 7%;

            background: #ec7374;

            border-radius:
                50% 50%
                45% 45%;
        }

        .mouth {
            position: absolute;

            left: 50%;
            top: 75%;

            width: 12%;
            height: 7%;

            transform:
                translateX(-50%);

            border-bottom:
                2px solid
                #75411f;

            border-radius: 50%;
        }

        .whisker {
            position: absolute;

            width: 27%;
            height: 1px;

            background:
                rgba(255,255,255,.75);

            top: 73%;
        }

        .whisker.left1 {
            left: 0;
            transform: rotate(8deg);
        }

        .whisker.left2 {
            left: 1%;
            top: 78%;
            transform: rotate(-3deg);
        }

        .whisker.right1 {
            right: 0;
            transform: rotate(-8deg);
        }

        .whisker.right2 {
            right: 1%;
            top: 78%;
            transform: rotate(3deg);
        }

        /* =========================
           КОРОНА
        ========================= */

        .crown {
            position: absolute;

            z-index: 10;

            left: 50%;
            top: -8%;

            width: 52%;
            height: 30%;

            transform:
                translateX(-50%)
                rotate(-2deg);

            background:
                linear-gradient(
                    145deg,
                    #fff09b 0%,
                    #ffc52e 35%,
                    #e99400 100%
                );

            clip-path:
                polygon(
                    0 20%,
                    20% 48%,
                    25% 0,
                    50% 38%,
                    75% 0,
                    80% 48%,
                    100% 20%,
                    91% 100%,
                    9% 100%
                );

            filter:
                drop-shadow(
                    0 7px 8px
                    rgba(0,0,0,.35)
                );
        }

        .crown-jewel {
            position: absolute;

            z-index: 11;

            left: 50%;
            top: 7%;

            width: 12%;
            height: 10%;

            transform:
                translateX(-50%)
                rotate(45deg);

            background:
                linear-gradient(
                    145deg,
                    #9de8ff,
                    #087fe8
                );

            border:
                2px solid
                #ffd94c;

            box-shadow:
                0 0 10px
                rgba(0,180,255,.8);
        }

        /* =========================
           НАЗВАНИЕ
        ========================= */

        .title {
            margin-top: 18px;

            color: white;

            font-size:
                clamp(
                    30px,
                    9vw,
                    48px
                );

            font-weight: 900;

            letter-spacing: -1.5px;

            text-shadow:
                0 4px 20px
                rgba(0,128,255,.35);
        }

        .subtitle {
            margin-top: 5px;

            color:
                rgba(210,233,255,.72);

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 1px;
        }

        /* =========================
           НИЖНИЙ ТЕКСТ
        ========================= */

        .bottom-text {
            position: absolute;

            bottom: 22px;

            color:
                rgba(181,215,245,.42);

            font-size: 11px;

            letter-spacing: 1.5px;
        }

        @media (max-height: 650px) {

            .avatar-wrap {
                width: 230px;
                height: 230px;
            }

            .title {
                margin-top: 8px;
            }

            .subtitle {
                display: none;
            }
        }

        @media (max-width: 360px) {

            .avatar-wrap {
                width: 245px;
                height: 245px;
            }

            .title {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <!-- КНОПКА УСТАНОВКИ -->

    <div class="top">

        <button id="installButton">
            Установить
        </button>

    </div>


    <!-- ЦЕНТР -->

    <main class="center">

        <div class="avatar-wrap">

            <div class="avatar-glow"></div>

            <div class="avatar">

                <div class="cat">

                    <div class="crown"></div>
                    <div class="crown-jewel"></div>

                    <div class="ear-left"></div>
                    <div class="ear-right"></div>

                    <div class="ear-inner-left"></div>
                    <div class="ear-inner-right"></div>

                    <div class="head">

                        <div class="eye left"></div>
                        <div class="eye right"></div>

                        <div class="muzzle"></div>

                        <div class="nose"></div>
                        <div class="mouth"></div>

                        <div class="whisker left1"></div>
                        <div class="whisker left2"></div>

                        <div class="whisker right1"></div>
                        <div class="whisker right2"></div>

                    </div>

                </div>

            </div>

        </div>


        <div class="title">
            Nexgram
        </div>

        <div class="subtitle">
            MESSENGER
        </div>

    </main>


    <div class="bottom-text">
        NEXGRAM
    </div>

</div>


<script>
"use strict";

/* ==========================================
   НАСТОЯЩАЯ PWA-УСТАНОВКА
========================================== */

let deferredPrompt = null;

const installButton =
    document.getElementById("installButton");


window.addEventListener(
    "beforeinstallprompt",
    function(event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.style.display = "block";
    }
);


installButton.addEventListener(
    "click",
    async function() {

        if (!deferredPrompt) {

            alert(
                "Установка пока недоступна. Откройте Nexgram в Chrome через HTTPS."
            );

            return;
        }

        deferredPrompt.prompt();

        const result =
            await deferredPrompt.userChoice;

        if (
            result &&
            result.outcome === "accepted"
        ) {

            installButton.style.display =
                "none";
        }

        deferredPrompt = null;
    }
);


window.addEventListener(
    "appinstalled",
    function() {

        installButton.style.display =
            "none";
    }
);


/* ==========================================
   SERVICE WORKER
========================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./sw.js")
                .then(function() {

                    console.log(
                        "Nexgram PWA готов"
                    );

                })
                .catch(function(error) {

                    console.log(
                        "SW:",
                        error
                    );

                });

        }
    );
}
</script>

</body>
</html>
