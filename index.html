<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AVIA</title>

<meta name="theme-color" content="#06101f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#040812;
    color:white;
    font-family:Arial,sans-serif;
}

/* верхняя установка */
#installBanner{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:99999;

    display:none;
    align-items:center;
    gap:12px;

    padding:12px;
    border-radius:18px;

    background:#101d31;
    border:1px solid #263852;

    box-shadow:0 15px 45px #0008;
}

#installIcon{
    width:52px;
    height:52px;
    border-radius:14px;
}

.installInfo{
    flex:1;
}

.installTitle{
    font-size:16px;
    font-weight:bold;
}

.installText{
    margin-top:4px;
    color:#8293ab;
    font-size:12px;
}

#installButton{
    border:0;
    border-radius:12px;
    padding:11px 14px;
    background:#1675ed;
    color:white;
    font-weight:bold;
}

#closeButton{
    border:0;
    background:none;
    color:#8293ab;
    font-size:22px;
}

/* приложение */

main{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.app{
    width:100%;
    max-width:430px;
    text-align:center;
}

.logo{
    width:150px;
    height:150px;
    margin:auto;
    border-radius:32px;
    overflow:hidden;
    box-shadow:0 20px 60px #1675ed40;
}

.logo img{
    width:100%;
    height:100%;
}

h1{
    margin:24px 0 0;
    font-size:48px;
    letter-spacing:4px;
}

.sub{
    margin-top:10px;
    color:#9aa9bd;
    font-size:17px;
}

.studio{
    margin-top:8px;
    color:#526986;
    font-size:13px;
}

#bigInstall{
    width:100%;
    margin-top:30px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:#1675ed;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#status{
    margin-top:14px;
    color:#687a93;
    font-size:13px;
}
</style>
</head>

<body>

<!-- ОКНО УСТАНОВКИ СВЕРХУ -->

<div id="installBanner">

    <img id="installIcon" src="./icon.svg">

    <div class="installInfo">
        <div class="installTitle">
            Установить AVIA
        </div>

        <div class="installText">
            Установить приложение на устройство
        </div>
    </div>

    <button id="installButton">
        Установить
    </button>

    <button id="closeButton">
        ×
    </button>

</div>


<main>

<div class="app">

    <div class="logo">
        <img src="./icon.svg" alt="AVIA">
    </div>

    <h1>AVIA</h1>

    <div class="sub">
        Умная нейросеть
    </div>

    <div class="studio">
        Cats Developer Studio
    </div>

    <button id="bigInstall">
        Установить AVIA
    </button>

    <div id="status"></div>

</div>

</main>


<script>

let installPrompt = null;

const banner = document.getElementById("installBanner");
const installButton = document.getElementById("installButton");
const bigInstall = document.getElementById("bigInstall");
const closeButton = document.getElementById("closeButton");
const status = document.getElementById("status");


/* Chrome сообщает, что AVIA можно установить */

window.addEventListener("beforeinstallprompt", function(event){

    event.preventDefault();

    installPrompt = event;

    banner.style.display = "flex";

});


/* установка */

async function installAVIA(){

    if(!installPrompt){

        status.textContent =
            "Chrome ещё готовит установку. Обнови страницу.";

        return;
    }

    installPrompt.prompt();

    const result = await installPrompt.userChoice;

    if(result.outcome === "accepted"){

        status.textContent =
            "AVIA устанавливается...";

        banner.style.display = "none";

    }

    installPrompt = null;

}


installButton.addEventListener(
    "click",
    installAVIA
);

bigInstall.addEventListener(
    "click",
    installAVIA
);


/* закрытие верхней плашки */

closeButton.addEventListener(
    "click",
    function(){

        banner.style.display = "none";

    }
);


/* приложение установлено */

window.addEventListener(
    "appinstalled",
    function(){

        banner.style.display = "none";

        bigInstall.style.display = "none";

        status.textContent =
            "AVIA установлена.";

    }
);


/* service worker */

if("serviceWorker" in navigator){

    window.addEventListener("load",function(){

        navigator.serviceWorker.register("./sw.js")
            .then(function(){
                console.log("AVIA Service Worker OK");
            })
            .catch(function(error){
                console.error(error);
            });

    });

}

</script>

</body>
</html>
