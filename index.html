<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>TWO CITIES: RUSSIA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    touch-action: manipulation;
}

/* =========================
   ГОРИЗОНТАЛЬНЫЙ РЕЖИМ
========================= */

#rotateScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background:
        radial-gradient(circle at 50% 40%, #172b55 0%, #080d1c 45%, #010207 100%);
    align-items: center;
    justify-content: center;
    text-align: center;
}

.rotate-box {
    padding: 30px;
}

.phone-icon {
    width: 70px;
    height: 110px;
    border: 3px solid white;
    border-radius: 16px;
    margin: 0 auto 25px;
    transform: rotate(90deg);
    position: relative;
    animation: rotatePhone 1.8s infinite ease-in-out;
}

.phone-icon::after {
    content: "";
    position: absolute;
    bottom: 7px;
    left: 50%;
    width: 7px;
    height: 7px;
    transform: translateX(-50%);
    background: white;
    border-radius: 50%;
}

.rotate-box h2 {
    font-size: 25px;
    letter-spacing: 3px;
}

.rotate-box p {
    margin-top: 12px;
    opacity: .65;
}

@keyframes rotatePhone {
    0%, 100% {
        transform: rotate(90deg);
    }
    50% {
        transform: rotate(0deg);
    }
}

/* =========================
   ЗАСТАВКА
========================= */

#splash {
    position: fixed;
    inset: 0;
    z-index: 5000;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 160, 255, .20), transparent 30%),
        radial-gradient(circle at 80% 75%, rgba(140, 0, 255, .22), transparent 35%),
        linear-gradient(135deg, #02030a, #070d1c 50%, #02030a);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: splashFade 1s ease forwards;
}

/* Светящиеся линии */

#splash::before {
    content: "";
    position: absolute;
    inset: -50%;
    background:
        linear-gradient(115deg,
            transparent 43%,
            rgba(0, 190, 255, .09) 44%,
            transparent 45%),
        linear-gradient(65deg,
            transparent 48%,
            rgba(170, 0, 255, .08) 49%,
            transparent 50%);
    animation: cityMove 8s linear infinite;
}

/* Горизонтальный неоновый свет */

#splash::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    left: 0;
    top: 58%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 190, 255, .8),
        rgba(180, 50, 255, .8),
        transparent
    );
    filter: blur(2px);
    box-shadow:
        0 0 20px rgba(0, 180, 255, .7),
        0 0 50px rgba(150, 0, 255, .5);
    animation: scanLine 3s ease-in-out infinite;
}

@keyframes cityMove {
    from {
        transform: translateX(-5%);
    }
    to {
        transform: translateX(5%);
    }
}

@keyframes scanLine {
    0%, 100% {
        opacity: .2;
    }
    50% {
        opacity: 1;
    }
}

.splash-content {
    position: relative;
    z-index: 5;
    text-align: center;
    width: 90%;
    max-width: 900px;
}

/* Маленькая надпись */

.studio {
    font-size: clamp(11px, 1.5vw, 17px);
    letter-spacing: 7px;
    text-transform: uppercase;
    opacity: .55;
    margin-bottom: 25px;
    animation: fadeUp 1.2s ease;
}

/* TWO CITIES */

.title-main {
    font-size: clamp(45px, 9vw, 120px);
    font-weight: 900;
    letter-spacing: clamp(5px, 1.2vw, 18px);
    line-height: .9;
    text-transform: uppercase;

    background: linear-gradient(
        90deg,
        #ffffff,
        #8fdfff,
        #ffffff,
        #c29cff,
        #ffffff
    );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
        0 0 15px rgba(0, 190, 255, .35),
        0 0 40px rgba(130, 40, 255, .25);

    animation:
        titleGlow 4s linear infinite,
        titleAppear 1.4s ease;
}

/* RUSSIA */

.title-sub {
    margin-top: 14px;
    font-size: clamp(25px, 5vw, 65px);
    font-weight: 800;
    letter-spacing: clamp(8px, 2vw, 25px);
    color: white;
    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 35px rgba(0,160,255,.4);
    animation: titleAppear 1.8s ease;
}

/* ГОРОДА */

.cities {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    font-size: clamp(10px, 1.5vw, 15px);
    letter-spacing: 4px;
    opacity: .65;
}

.dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #69dfff;
    box-shadow: 0 0 15px #69dfff;
}

/* Линия */

.line {
    width: min(500px, 70%);
    height: 1px;
    margin: 32px auto 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );
}

/* Загрузка */

.loading {
    margin: 30px auto 0;
    width: min(400px, 70%);
}

.loading-text {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 3px;
    opacity: .5;
    margin-bottom: 8px;
}

.loading-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,.12);
    overflow: hidden;
    border-radius: 10px;
}

.loading-progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        #4bdcff,
        #a86cff,
        #ffffff
    );
    box-shadow:
        0 0 10px #5bdfff,
        0 0 25px #8d55ff;
    animation: loading 5s linear forwards;
}

@keyframes loading {
    from {
        width: 0%;
    }
    to {
        width: 100%;
    }
}

@keyframes titleGlow {
    from {
        background-position: 0% center;
    }
    to {
        background-position: 300% center;
    }
}

@keyframes titleAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.95);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: .55;
        transform: translateY(0);
    }
}

/* =========================
   ИГРОВОЙ ЭКРАН
========================= */

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 25%,
            rgba(30, 90, 150, .25),
            transparent 50%
        ),
        linear-gradient(
            to bottom,
            #050914 0%,
            #081226 45%,
            #020307 100%
        );
}

/* Небо */

.sky-glow {
    position: absolute;
    width: 70vw;
    height: 70vw;
    max-width: 800px;
    max-height: 800px;
    left: 50%;
    top: 5%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(30, 120, 200, .16),
        transparent 65%
    );
}

/* Город */

.city {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 28%;
    height: 45%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
}

.building {
    width: clamp(35px, 7vw, 110px);
    background: linear-gradient(
        90deg,
        #080c17,
        #151d32,
        #070b14
    );
    border-top: 1px solid rgba(130, 200, 255, .15);
    position: relative;
}

.building:nth-child(1) { height: 45%; }
.building:nth-child(2) { height: 70%; }
.building:nth-child(3) { height: 55%; }
.building:nth-child(4) { height: 85%; }
.building:nth-child(5) { height: 62%; }
.building:nth-child(6) { height: 92%; }
.building:nth-child(7) { height: 55%; }
.building:nth-child(8) { height: 76%; }
.building:nth-child(9) { height: 45%; }

.building::after {
    content: "";
    position: absolute;
    inset: 10px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80, 190, 255, .65) 0px,
            rgba(80, 190, 255, .65) 3px,
            transparent 3px,
            transparent 18px
        );
    opacity: .3;
}

/* Дорога */

.road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30%;
    background:
        linear-gradient(
            to bottom,
            #101725,
            #05070c
        );
    clip-path: polygon(
        35% 0,
        65% 0,
        100% 100%,
        0 100%
    );
}

.road::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 5px;
    transform: translateX(-50%);
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.8) 0px,
            rgba(255,255,255,.8) 45px,
            transparent 45px,
            transparent 90px
        );
    opacity: .35;
}

/* HUD */

.hud {
    position: absolute;
    z-index: 20;
    top: 18px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.hud-item {
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(5,10,20,.55);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.7);
}

/* =========================
   МОБИЛЬНАЯ АДАПТАЦИЯ
========================= */

@media (orientation: portrait) {
    #rotateScreen {
        display: flex;
    }

    #splash,
    #game {
        display: none !important;
    }
}

@media (orientation: landscape) {
    #rotateScreen {
        display: none !important;
    }
}
</style>
</head>

<body>

<!-- ЭКРАН ПОВОРОТА -->
<div id="rotateScreen">
    <div class="rotate-box">
        <div class="phone-icon"></div>
        <h2>ПОВЕРНИТЕ ТЕЛЕФОН</h2>
        <p>Игра работает в горизонтальном режиме</p>
    </div>
</div>

<!-- =========================
     ЗАСТАВКА
========================= -->

<section id="splash">

    <div class="splash-content">

        <div class="studio">
            CATS DEVELOPER STUDIO GAME
        </div>

        <div class="title-main">
            TWO CITIES
        </div>

        <div class="title-sub">
            RUSSIA
        </div>

        <div class="cities">
            <span>MOSCOW</span>

            <span class="dot"></span>

            <span>KRASNODAR</span>
        </div>

        <div class="line"></div>

        <div class="loading">

            <div class="loading-text">
                <span>ЗАГРУЗКА ИГРЫ</span>
                <span id="percent">0%</span>
            </div>

            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>

        </div>

    </div>

</section>


<!-- =========================
     ИГРА
========================= -->

<main id="game">

    <div class="sky-glow"></div>

    <div class="city">

        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

    </div>

    <div class="road"></div>

    <div class="hud">

        <div class="hud-item">
            TWO CITIES
        </div>

        <div class="hud-item">
            MOSCOW • KRASNODAR
        </div>

    </div>

</main>


<script>

/* =========================
   ПРОГРЕСС 0 → 100%
========================= */

let percent = 0;

const percentElement =
    document.getElementById("percent");

const progressTimer =
    setInterval(() => {

        percent++;

        percentElement.textContent =
            percent + "%";

        if (percent >= 100) {
            clearInterval(progressTimer);
        }

    }, 50);


/* =========================
   ПОПЫТКА ЗАБЛОКИРОВАТЬ
   ОРИЕНТАЦИЮ В LANDSCAPE
========================= */

async function lockLandscape() {

    try {

        if (screen.orientation &&
            screen.orientation.lock) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    } catch (error) {

        /*
         На iPhone и некоторых
         браузерах блокировка
         может быть запрещена.
         Поэтому показываем
         собственный экран поворота.
        */

    }

}

lockLandscape();


/* =========================
   ЧЕРЕЗ 5 СЕКУНД
   УБИРАЕМ ЗАСТАВКУ
========================= */

setTimeout(() => {

    const splash =
        document.getElementById("splash");

    splash.style.transition =
        "opacity 0.8s ease";

    splash.style.opacity = "0";

    setTimeout(() => {

        splash.remove();

    }, 800);

}, 5000);

</script>

</body>
</html>
