<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050b16;
    color: white;
    font-family: Arial, sans-serif;
}

/* Верхнее окно установки */
#installBanner {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 9999;

    display: none;
    align-items: center;
    gap: 12px;

    padding: 12px 14px;
    border-radius: 18px;

    background: rgba(14, 27, 48, .96);
    border: 1px solid rgba(255,255,255,.1);

    box-shadow: 0 15px 45px rgba(0,0,0,.45);
    backdrop-filter: blur(15px);
}

#installIcon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 13px;
    object-fit: cover;
}

.installText {
    flex: 1;
}

.installTitle {
    font-size: 16px;
    font-weight: bold;
}

.installSub {
    margin-top: 4px;
    color: #91a1b8;
    font-size: 12px;
}

#installButton {
    border: 0;
    padding: 10px 14px;
    border-radius: 12px;

    background: #1675ed;
    color: white;

    font-size: 14px;
    font-weight: bold;
}

#closeInstall {
    border: 0;
    background: transparent;
    color: #71819a;
    font-size: 20px;
}

/* Основная страница */
main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.card {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.logo {
    width: 150px;
    height: 150px;
    margin: 0 auto 25px;
    border-radius: 34px;
    overflow: hidden;

    box-shadow: 0 20px 70px rgba(22,117,237,.25);
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 4px;
}

.description {
    margin-top: 10px;
    color: #9aa9bd;
    font-size: 17px;
}

.studio {
    margin-top: 8px;
    color: #536984;
    font-size: 13px;
}

.bigInstall {
    margin-top: 30px;
    width: 100%;
    padding: 17px;

    border: 0;
    border-radius: 16px;

    background: #1675ed;
    color: white;

    font-size: 17px;
    font-weight: bold;
}

.status {
    margin-top: 12px;
    color: #60718a;
    font-size: 13px;
}
</style>
</head>

<body>

<!-- ОКНО СВЕРХУ -->
<div id="installBanner">

    <img
        id="installIcon"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='105' fill='%2307152d'/%3E%3Cpath d='M250 300C215 325 174 350 145 381C121 406 108 430 103 453C137 431 170 414 205 405C242 396 274 382 302 363Z' fill='%231675ed'/%3E%3Cpath d='M279 267C299 238 306 207 291 180C271 143 232 124 190 111C150 99 119 82 86 58C87 103 98 143 122 175C151 214 193 235 236 249C255 255 270 261 279 267Z' fill='%23d8edff'/%3E%3Cpath d='M89 183C126 201 165 213 208 225C248 236 276 251 286 272C272 293 246 307 216 311C175 306 136 288 109 262C92 245 80 216 89 183Z' fill='%234ca9ff'/%3E%3Cpath d='M283 248C295 203 318 166 350 153C379 141 403 151 424 168C440 181 455 187 474 190C452 204 430 211 416 229C402 247 398 277 388 307C375 346 350 371 314 385C282 398 247 398 211 407C232 386 253 365 272 344C293 320 305 286 283 248Z' fill='white'/%3E%3Ccircle cx='397' cy='183' r='12' fill='%2307152d'/%3E%3C/svg%3E"
        alt="AVIA"
    >

    <div class="installText">
        <div class="installTitle">Установить AVIA</div>
        <div class="installSub">Добавить приложение на устройство</div>
    </div>

    <button id="installButton">Установить</button>

    <button id="closeInstall">×</button>
</div>


<main>
    <div class="card">

        <div class="logo">
            <img
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='105' fill='%2307152d'/%3E%3Cpath d='M250 300C215 325 174 350 145 381C121 406 108 430 103 453C137 431 170 414 205 405C242 396 274 382 302 363Z' fill='%231675ed'/%3E%3Cpath d='M279 267C299 238 306 207 291 180C271 143 232 124 190 111C150 99 119 82 86 58C87 103 98 143 122 175C151 214 193 235 236 249C255 255 270 261 279 267Z' fill='%23d8edff'/%3E%3Cpath d='M89 183C126 201 165 213 208 225C248 236 276 251 286 272C272 293 246 307 216 311C175 306 136 288 109 262C92 245 80 216 89 183Z' fill='%234ca9ff'/%3E%3Cpath d='M283 248C295 203 318 166 350 153C379 141 403 151 424 168C440 181 455 187 474 190C452 204 430 211 416 229C402 247 398 277 388 307C375 346 350 371 314 385C282 398 247 398 211 407C232 386 253 365 272 344C293 320 305 286 283 248Z' fill='white'/%3E%3Ccircle cx='397' cy='183' r='12' fill='%2307152d'/%3E%3C/svg%3E"
                alt="AVIA"
            >
        </div>

        <h1>AVIA</h1>

        <div class="description">
            Умная нейросеть
        </div>

        <div class="studio">
            Cats Developer Studio
        </div>

        <button class="bigInstall" id="bigInstall">
            Установить AVIA
        </button>

        <div class="status" id="status"></div>

    </div>
</main>


<script>
let deferredPrompt = null;

const banner = document.getElementById("installBanner");
const installButton = document.getElementById("installButton");
const bigInstall = document.getElementById("bigInstall");
const closeInstall = document.getElementById("closeInstall");
const status = document.getElementById("status");


/* Chrome сообщает, что приложение можно установить */
window.addEventListener("beforeinstallprompt", (event) => {

    event.preventDefault();

    deferredPrompt = event;

    banner.style.display = "flex";
});


/* Установка */
async function installApp() {

    if (!deferredPrompt) {
        status.textContent =
            "Открой меню браузера и выбери «Установить приложение».";
        return;
    }

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {
        status.textContent = "AVIA устанавливается...";
        banner.style.display = "none";
    } else {
        status.textContent = "Установка отменена";
    }

    deferredPrompt = null;
}


installButton.addEventListener("click", installApp);
bigInstall.addEventListener("click", installApp);


/* Закрыть верхнее окно */
closeInstall.addEventListener("click", () => {
    banner.style.display = "none";
});


/* После установки */
window.addEventListener("appinstalled", () => {

    banner.style.display = "none";

    bigInstall.style.display = "none";

    status.textContent = "AVIA установлена на устройство.";
});
</script>

</body>
</html>
