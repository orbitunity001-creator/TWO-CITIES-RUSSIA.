<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#07111f">

    <!-- Иконка AVIA -->
    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="./icon.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="512x512"
        href="./icon.png"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json?v=2"
    >

    <title>AVIA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #050914;

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .avia {
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;

            margin: 0 auto 22px;

            border-radius: 32px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(40, 130, 255, .25),
                0 0 45px rgba(40, 130, 255, .12);
        }

        .logo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        h1 {
            margin: 0;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: 3px;
        }

        p {
            margin: 8px 0 0;

            color: #7e8ca2;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="avia">

        <div class="logo">
            <img
                src="./icon.png"
                alt="AVIA"
            >
        </div>

        <h1>AVIA</h1>

        <p>AI Assistant</p>

    </main>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js?v=2");
            });
        }
    </script>

</body>
</html>
