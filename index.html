<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta name="theme-color" content="#06101f">

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <!-- ИМЕННО ПТИЧКА -->
    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>AVIA</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #040812;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .content {
            width: 100%;
            max-width: 430px;

            text-align: center;
        }

        /*
        =====================================
        ПТИЧКА AVIA
        =====================================
        */

        .bird {
            width: 150px;
            height: 150px;

            margin: 0 auto 25px;

            border-radius: 40px;

            overflow: hidden;

            background: #06101f;

            box-shadow:
                0 20px 70px
                rgba(20, 130, 255, 0.30);
        }

        .bird img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        /*
        =====================================
        AVIA
        =====================================
        */

        h1 {
            margin: 0;

            font-size: 54px;
            font-weight: 800;

            letter-spacing: -2px;

            line-height: 1;
        }

        .subtitle {
            margin-top: 12px;

            color: #9ca8ba;

            font-size: 17px;
        }

        .studio {
            margin-top: 9px;

            color: #4e9cff;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;
        }

        /*
        =====================================
        КАРТОЧКА
        =====================================
        */

        .card {
            margin-top: 32px;

            padding: 24px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .card h2 {
            margin: 0 0 9px;

            font-size: 21px;
        }

        .card p {
            margin: 0;

            color: #929daf;

            font-size: 14px;

            line-height: 1.55;
        }

        /*
        =====================================
        КНОПКА УСТАНОВКИ
        =====================================
        */

        #install {
            display: none;

            width: 100%;

            margin-top: 20px;

            padding: 16px;

            border: none;

            border-radius: 17px;

            background: #1683ff;

            color: white;

            font-size: 16px;

            font-weight: 800;
        }

        #install.show {
            display: block;
        }

        #install:active {
            transform: scale(0.97);
        }

        .hint {
            margin-top: 15px;

            color: #687588;

            font-size: 12px;

            line-height: 1.5;
        }

    </style>
</head>


<body>

<div class="page">

    <div class="content">

        <!-- ТВОЯ ПТИЧКА -->
        <div class="bird">

            <img
                src="icon.png"
                alt="AVIA"
            >

        </div>


        <h1>
            AVIA
        </h1>


        <div class="subtitle">
            Умная нейросеть
        </div>


        <div class="studio">
            CATS DEVELOPER STUDIO
        </div>


        <div class="card">

            <h2>
                Добро пожаловать в AVIA
            </h2>

            <p>
                Установи AVIA на главный экран
                телефона и запускай как обычное
                приложение.
            </p>


            <button id="install">
                Установить AVIA
            </button>


            <div class="hint">
                Если кнопка не появилась,
                открой меню Chrome →
                «Установить приложение».
            </div>

        </div>

    </div>

</div>


<script>

let deferredPrompt = null;

const installButton =
    document.getElementById("install");


/*
=====================================
УСТАНОВКА PWA
=====================================
*/

window.addEventListener(
    "beforeinstallprompt",
    function(event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.classList.add(
            "show"
        );

    }
);


installButton.addEventListener(
    "click",
    async function() {

        if (!deferredPrompt) {
            return;
        }

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        installButton.classList.remove(
            "show"
        );

    }
);


/*
=====================================
SERVICE WORKER
=====================================
*/

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "sw.js"
            );

        }
    );

}

</script>

</body>
</html>
