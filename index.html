<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TWO CITIES: RUSSIA</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050608">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050608;
    color:#fff;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    background:#050608;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.rotate-box{
    padding:30px;
}

.rotate-icon{
    font-size:65px;
    margin-bottom:20px;
}

.rotate-box h2{
    font-size:24px;
    letter-spacing:2px;
}

.rotate-box p{
    margin-top:10px;
    color:#888;
}

@media(max-width:800px) and (orientation:portrait){
    #rotate{
        display:flex;
    }
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#050608;
}

/* BACKGROUND */

.background{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 72% 20%,
            rgba(0,170,255,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 75%,
            rgba(255,20,50,.12),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #030406 0%,
            #080b10 48%,
            #030405 100%
        );
}

.grid{
    position:absolute;
    inset:0;
    opacity:.14;
    background-image:
        linear-gradient(
            rgba(0,180,255,.25) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,180,255,.25) 1px,
            transparent 1px
        );
    background-size:70px 70px;
    transform:perspective(600px) rotateX(55deg) scale(1.8);
    transform-origin:bottom;
}

.glow-red{
    position:absolute;
    width:400px;
    height:400px;
    left:-180px;
    bottom:-220px;
    border-radius:50%;
    background:#ff153d;
    filter:blur(130px);
    opacity:.12;
}

.glow-blue{
    position:absolute;
    width:430px;
    height:430px;
    right:-200px;
    top:-180px;
    border-radius:50%;
    background:#009dff;
    filter:blur(130px);
    opacity:.15;
}

/* CITY */

.city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:55%;
    opacity:.72;
}

.building{
    position:absolute;
    bottom:0;
    background:
        linear-gradient(
            90deg,
            #080a0e,
            #171b21,
            #090b0e
        );
    border:1px solid rgba(255,255,255,.04);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.7);
}

.building:after{
    content:"";
    position:absolute;
    inset:12px;
    opacity:.4;
    background:
        repeating-linear-gradient(
            90deg,
            #268dc1 0 5px,
            transparent 5px 23px
        ),
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.4) 0 4px,
            transparent 4px 22px
        );
}

.b1{left:0;width:9%;height:48%}
.b2{left:8%;width:11%;height:72%}
.b3{left:18%;width:8%;height:56%}
.b4{left:25%;width:12%;height:88%}
.b5{left:36%;width:10%;height:61%}
.b6{left:45%;width:14%;height:78%}
.b7{left:58%;width:9%;height:52%}
.b8{left:66%;width:12%;height:83%}
.b9{left:77%;width:9%;height:58%}
.b10{left:85%;width:15%;height:73%}

/* ROAD */

.road{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-25%;
    height:48%;
    background:
        linear-gradient(
            90deg,
            #090a0d,
            #171a1e,
            #08090b
        );
    clip-path:polygon(
        39% 0,
        61% 0,
        100% 100%,
        0 100%
    );
    border-top:1px solid #20252b;
}

.road:after{
    content:"";
    position:absolute;
    left:49%;
    top:0;
    width:2%;
    height:100%;
    background:
        repeating-linear-gradient(
            0deg,
            #e7edf2 0 30px,
            transparent 30px 75px
        );
    transform:perspective(300px) rotateX(18deg);
    opacity:.7;
}

/* TOP */

.topbar{
    position:absolute;
    z-index:20;
    top:20px;
    left:25px;
    right:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    padding:10px 18px;
    border-left:3px solid #ff2045;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.logo b{
    font-size:18px;
    letter-spacing:2px;
}

.logo span{
    color:#ff2347;
}

.hud{
    display:none;
    align-items:center;
    gap:10px;
}

.hud-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff2347;
    background:#0d1116;
}

.hud-name{
    padding:10px 15px;
    background:rgba(0,0,0,.7);
    border:1px solid #262c33;
}

/* SPLASH */

.screen{
    position:absolute;
    inset:0;
    z-index:10;
}

#splash{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.splash{
    width:min(800px,92vw);
}

.car{
    width:310px;
    height:145px;
    position:relative;
    margin:auto;
    filter:drop-shadow(0 25px 25px rgba(255,0,40,.2));
}

.car-body{
    position:absolute;
    left:25px;
    bottom:28px;
    width:260px;
    height:67px;
    border-radius:18px 55px 12px 12px;
    background:
        linear-gradient(
            180deg,
            #ff3153,
            #bd092b 55%,
            #650717
        );
    border:2px solid #ff526b;
    box-shadow:
        inset 0 5px 12px rgba(255,255,255,.3),
        0 15px 30px rgba(255,0,40,.25);
}

.car-roof{
    position:absolute;
    left:82px;
    top:18px;
    width:145px;
    height:60px;
    border-radius:65px 65px 8px 8px;
    background:
        linear-gradient(
            135deg,
            #172e3d,
            #071017
        );
    border:2px solid #e32b48;
}

.car-window{
    position:absolute;
    left:98px;
    top:28px;
    width:115px;
    height:40px;
    background:
        linear-gradient(
            135deg,
            #244d63,
            #071015
        );
    clip-path:polygon(
        10% 100%,
        30% 0,
        100% 0,
        100% 100%
    );
}

.wheel{
    position:absolute;
    width:47px;
    height:47px;
    bottom:7px;
    border-radius:50%;
    background:#030405;
    border:5px solid #30363d;
    box-shadow:0 0 0 2px #080a0d;
}

.wheel:after{
    content:"";
    position:absolute;
    inset:11px;
    border-radius:50%;
    background:#7e8790;
    box-shadow:inset 0 0 0 4px #20252b;
}

.wheel.left{left:52px}
.wheel.right{right:52px}

.splash-title{
    margin-top:5px;
    font-size:clamp(45px,8vw,86px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-4px;
    text-transform:uppercase;
}

.splash-title span{
    color:#ff2145;
}

.splash-sub{
    margin-top:17px;
    color:#8b98a5;
    letter-spacing:5px;
    font-weight:bold;
}

.studio{
    margin-top:13px;
    color:#4e5964;
    font-size:13px;
    letter-spacing:2px;
}

.loader{
    width:min(500px,75vw);
    height:5px;
    margin:30px auto 0;
    background:#161b20;
    overflow:hidden;
}

.loader-bar{
    height:100%;
    width:0;
    background:linear-gradient(
        90deg,
        #008cff,
        #ff2045
    );
    box-shadow:
        0 0 15px #ff2045;
}

.loading{
    margin-top:12px;
    color:#687580;
    font-size:12px;
    letter-spacing:2px;
}

/* AUTH */

#auth{
    display:none;
    align-items:center;
    justify-content:center;
}

.auth-card{
    width:min(450px,92vw);
    padding:32px;
    background:
        linear-gradient(
            145deg,
            rgba(20,23,28,.97),
            rgba(7,9,12,.97)
        );
    border:1px solid #262c33;
    border-top:2px solid #ff2045;
    box-shadow:
        0 35px 100px rgba(0,0,0,.65);
}

.auth-title{
    font-size:28px;
    font-weight:1000;
    letter-spacing:2px;
}

.auth-title span{
    color:#ff2145;
}

.tabs{
    display:flex;
    margin:25px 0;
    border-bottom:1px solid #252b31;
}

.tab{
    flex:1;
    padding:13px;
    border:0;
    background:none;
    color:#59636d;
    font-weight:bold;
}

.tab.active{
    color:#fff;
    border-bottom:2px solid #ff2045;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#697580;
    font-size:11px;
    letter-spacing:1.5px;
    font-weight:bold;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #292f36;
    outline:none;
    border-radius:3px;
    padding:14px;
    background:#0b0e12;
    color:white;
}

.field input:focus,
.field textarea:focus{
    border-color:#008cff;
    box-shadow:0 0 0 1px #008cff;
}

.field textarea{
    min-height:90px;
    resize:none;
}

.primary{
    width:100%;
    border:0;
    padding:15px;
    background:linear-gradient(
        90deg,
        #d90e32,
        #ff2145
    );
    color:#fff;
    font-weight:1000;
    letter-spacing:1px;
    box-shadow:0 10px 25px rgba(255,20,60,.18);
}

.message{
    min-height:20px;
    margin-top:13px;
    color:#ff425e;
    font-size:13px;
    text-align:center;
}

/* MENU */

#menu{
    display:none;
}

.menu-panel{
    position:absolute;
    z-index:15;
    left:7%;
    top:50%;
    transform:translateY(-50%);
    width:min(460px,43vw);
}

.menu-line{
    width:70px;
    height:3px;
    background:#ff2045;
    margin-bottom:20px;
    box-shadow:0 0 15px #ff2045;
}

.menu-title{
    font-size:clamp(43px,6vw,78px);
    line-height:.86;
    font-weight:1000;
    letter-spacing:-4px;
}

.menu-title span{
    color:#ff2045;
}

.menu-city{
    margin:20px 0 28px;
    color:#687682;
    font-size:13px;
    letter-spacing:4px;
}

.menu-buttons{
    display:grid;
    gap:9px;
}

.menu-btn{
    border:1px solid #252b31;
    padding:17px 20px;
    text-align:left;
    background:rgba(8,10,13,.85);
    color:#d8dde2;
    font-weight:900;
    transition:.2s;
}

.menu-btn:hover{
    border-color:#008cff;
    transform:translateX(5px);
}

.menu-btn.play{
    background:#e8193c;
    border-color:#ff3655;
    color:white;
    box-shadow:0 10px 35px rgba(255,20,55,.2);
}

/* MODALS */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);
}

.modal-card{
    width:min(520px,94vw);
    max-height:90vh;
    overflow:auto;
    padding:30px;
    background:#090b0f;
    border:1px solid #292f36;
    border-top:2px solid #ff2045;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-head h2{
    font-size:24px;
}

.close{
    width:35px;
    height:35px;
    border:1px solid #292f36;
    background:#11151a;
    color:#aaa;
    font-size:20px;
}

.avatar-box{
    text-align:center;
    margin-bottom:22px;
}

.avatar{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ff2045;
    background:#0b0e12;
    box-shadow:0 0 30px rgba(255,20,55,.2);
}

.avatar-upload{
    display:inline-block;
    margin-top:13px;
    padding:10px 16px;
    background:#11151a;
    border:1px solid #292f36;
    color:#aab3bb;
    cursor:pointer;
}

.avatar-upload input{
    display:none;
}

.secondary{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:1px solid #292f36;
    background:#11151a;
    color:#ccd3d9;
}

.danger{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:1px solid #681527;
    background:#210a10;
    color:#ff4861;
}

/* GAME */

#game{
    display:none;
}

.game-hud{
    position:absolute;
    left:25px;
    bottom:25px;
    z-index:30;
    padding:15px 20px;
    background:rgba(5,7,9,.9);
    border-left:3px solid #ff2045;
}

.game-hud b{
    color:#ff2045;
}

.back{
    position:absolute;
    right:25px;
    bottom:25px;
    z-index:30;
    border:1px solid #292f36;
    background:#0b0e12;
    color:#fff;
    padding:13px 20px;
}

/* EXTRA EFFECTS */

.scanline{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.012) 0 1px,
            transparent 1px 4px
        );
}

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;
    box-shadow:
        inset 0 0 180px rgba(0,0,0,.75);
}

@media(max-width:800px){
    .menu-panel{
        left:6%;
        width:48vw;
    }

    .menu-title{
        font-size:43px;
    }

    .city{
        opacity:.55;
    }
}
</style>
</head>

<body>

<div id="rotate">
    <div class="rotate-box">
        <div class="rotate-icon">↔</div>
        <h2>ПОВЕРНИТЕ ТЕЛЕФОН</h2>
        <p>TWO CITIES: RUSSIA работает горизонтально</p>
    </div>
</div>

<div id="app">

    <div class="background"></div>
    <div class="grid"></div>
    <div class="glow-red"></div>
    <div class="glow-blue"></div>

    <div class="city">
        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>
        <div class="building b6"></div>
        <div class="building b7"></div>
        <div class="building b8"></div>
        <div class="building b9"></div>
        <div class="building b10"></div>
    </div>

    <div class="road"></div>

    <div class="scanline"></div>
    <div class="vignette"></div>

    <div class="topbar">

        <div class="logo">
            <b>TWO CITIES <span>RUSSIA</span></b>
        </div>

        <div class="hud" id="hud">
            <img id="hudAvatar"
                 class="hud-avatar"
                 src="./icon.svg">
            <div id="hudName"
                 class="hud-name">
                Игрок
            </div>
        </div>

    </div>

    <!-- SPLASH -->

    <section id="splash" class="screen">

        <div class="splash">

            <div class="car">

                <div class="car-roof"></div>
                <div class="car-window"></div>
                <div class="car-body"></div>

                <div class="wheel left"></div>
                <div class="wheel right"></div>

            </div>

            <div class="splash-title">
                TWO CITIES
                <span>RUSSIA</span>
            </div>

            <div class="splash-sub">
                MOSCOW • KRASNODAR
            </div>

            <div class="studio">
                CATS DEVELOPER STUDIO
            </div>

            <div class="loader">
                <div id="loaderBar"
                     class="loader-bar"></div>
            </div>

            <div id="loading"
                 class="loading">
                INITIALIZING WORLD 0%
            </div>

        </div>

    </section>

    <!-- AUTH -->

    <section id="auth" class="screen">

        <div class="auth-card">

            <div class="auth-title">
                TWO CITIES
                <span>RUSSIA</span>
            </div>

            <div class="tabs">

                <button id="loginTab"
                        class="tab active">
                    ВХОД
                </button>

                <button id="registerTab"
                        class="tab">
                    РЕГИСТРАЦИЯ
                </button>

            </div>

            <div class="field">

                <label>НОМЕР ТЕЛЕФОНА</label>

                <input id="phone"
                       type="tel"
                       placeholder="+7 900 000-00-00">

            </div>

            <div id="nicknameField"
                 class="field"
                 style="display:none">

                <label>НИКНЕЙМ</label>

                <input id="nickname"
                       type="text"
                       maxlength="24"
                       placeholder="Ваш никнейм">

            </div>

            <div class="field">

                <label>ПАРОЛЬ</label>

                <input id="password"
                       type="password"
                       placeholder="Ваш пароль">

            </div>

            <button id="authButton"
                    class="primary">
                ВОЙТИ В ИГРУ
            </button>

            <div id="authMessage"
                 class="message"></div>

        </div>

    </section>

    <!-- MENU -->

    <section id="menu"
             class="screen">

        <div class="menu-panel">

            <div class="menu-line"></div>

            <div class="menu-title">
                TWO<br>
                CITIES<br>
                <span>RUSSIA</span>
            </div>

            <div class="menu-city">
                MOSCOW / KRASNODAR
            </div>

            <div class="menu-buttons">

                <button id="playButton"
                        class="menu-btn play">
                    ▶ &nbsp; ИГРАТЬ
                </button>

                <button id="profileButton"
                        class="menu-btn">
                    ◉ &nbsp; ПРОФИЛЬ
                </button>

                <button id="settingsButton"
                        class="menu-btn">
                    ⚙ &nbsp; НАСТРОЙКИ
                </button>

            </div>

        </div>

    </section>

    <!-- GAME -->

    <section id="game"
             class="screen">

        <div class="game-hud">
            <b>TWO CITIES: RUSSIA</b><br>
            МОСКВА • ОТКРЫТЫЙ МИР
        </div>

        <button id="backGame"
                class="back">
            ← МЕНЮ
        </button>

    </section>

</div>

<!-- PROFILE -->

<div id="profileModal"
     class="modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2>ПРОФИЛЬ</h2>

            <button class="close"
                    data-close="profileModal">
                ×
            </button>

        </div>

        <div class="avatar-box">

            <img id="profileAvatar"
                 class="avatar"
                 src="./icon.svg">

            <label class="avatar-upload">

                📷 ИЗМЕНИТЬ АВАТАР

                <input id="avatarInput"
                       type="file"
                       accept="image/*">

            </label>

        </div>

        <div class="field">

            <label>НИКНЕЙМ</label>

            <input id="profileNickname"
                   maxlength="24">

        </div>

        <div class="field">

            <label>О СЕБЕ</label>

            <textarea id="profileDescription"
                      maxlength="180"></textarea>

        </div>

        <button id="saveProfile"
                class="primary">
            СОХРАНИТЬ
        </button>

        <button id="profileLogout"
                class="danger">
            ВЫЙТИ ИЗ АККАУНТА
        </button>

    </div>

</div>

<!-- SETTINGS -->

<div id="settingsModal"
     class="modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2>НАСТРОЙКИ</h2>

            <button class="close"
                    data-close="settingsModal">
                ×
            </button>

        </div>

        <button id="fullscreenButton"
                class="secondary">
            ⛶ ПОЛНЫЙ ЭКРАН
        </button>

        <button id="settingsLogout"
                class="danger">
            ВЫЙТИ ИЗ АККАУНТА
        </button>

    </div>

</div>

<script>
const ACCOUNTS_KEY = "two_cities_accounts_v2";
const PROFILES_KEY = "two_cities_profiles_v2";
const CURRENT_KEY = "two_cities_current_v2";

let mode = "login";

const $ = id => document.getElementById(id);

function getAccounts(){
    try{
        return JSON.parse(
            localStorage.getItem(ACCOUNTS_KEY)
        ) || {};
    }catch{
        return {};
    }
}

function saveAccounts(data){
    localStorage.setItem(
        ACCOUNTS_KEY,
        JSON.stringify(data)
    );
}

function getProfiles(){
    try{
        return JSON.parse(
            localStorage.getItem(PROFILES_KEY)
        ) || {};
    }catch{
        return {};
    }
}

function saveProfiles(data){
    localStorage.setItem(
        PROFILES_KEY,
        JSON.stringify(data)
    );
}

function normalizePhone(phone){

    phone = phone
        .replace(/[^\d+]/g,"");

    if(phone.startsWith("8")){
        phone = "+7" + phone.substring(1);
    }

    if(phone.startsWith("7")){
        phone = "+" + phone;
    }

    return phone;
}

function showScreen(screen){

    ["splash","auth","menu","game"]
        .forEach(id=>{
            $(id).style.display="none";
        });

    if(screen==="splash"){
        $("splash").style.display="flex";
    }

    if(screen==="auth"){
        $("auth").style.display="flex";
    }

    if(screen==="menu"){
        $("menu").style.display="block";
    }

    if(screen==="game"){
        $("game").style.display="block";
    }
}

function message(text){
    $("authMessage").textContent=text;
}

function updateHUD(){

    const current =
        localStorage.getItem(CURRENT_KEY);

    if(!current){
        $("hud").style.display="none";
        return;
    }

    const profiles=getProfiles();
    const profile=profiles[current] || {};

    $("hudName").textContent =
        profile.nickname || "Игрок";

    $("hudAvatar").src =
        profile.avatar || "./icon.svg";

    $("hud").style.display="flex";
}

function enterMenu(){
    updateHUD();
    showScreen("menu");
}

function logout(){

    localStorage.removeItem(
        CURRENT_KEY
    );

    $("phone").value="";
    $("password").value="";
    $("nickname").value="";

    message("");

    updateHUD();
    showScreen("auth");
}

/* AUTH */

$("loginTab").onclick=()=>{

    mode="login";

    $("loginTab")
        .classList.add("active");

    $("registerTab")
        .classList.remove("active");

    $("nicknameField")
        .style.display="none";

    $("authButton")
        .textContent="ВОЙТИ В ИГРУ";

    message("");
};

$("registerTab").onclick=()=>{

    mode="register";

    $("registerTab")
        .classList.add("active");

    $("loginTab")
        .classList.remove("active");

    $("nicknameField")
        .style.display="block";

    $("authButton")
        .textContent="СОЗДАТЬ АККАУНТ";

    message("");
};

function auth(){

    const phone=normalizePhone(
        $("phone").value.trim()
    );

    const password=
        $("password").value;

    const nickname=
        $("nickname").value.trim();

    if(!phone){
        message("Введите номер телефона");
        return;
    }

    if(!password){
        message("Введите пароль");
        return;
    }

    const accounts=getAccounts();
    const profiles=getProfiles();

    if(mode==="register"){

        if(accounts[phone]){
            message(
                "Этот номер телефона уже зарегистрирован"
            );
            return;
        }

        if(!nickname){
            message("Введите никнейм");
            return;
        }

        if(password.length<4){
            message(
                "Пароль должен содержать минимум 4 символа"
            );
            return;
        }

        accounts[phone]={
            password:password
        };

        profiles[phone]={
            nickname:nickname,
            description:"",
            avatar:"./icon.svg"
        };

        saveAccounts(accounts);
        saveProfiles(profiles);

        localStorage.setItem(
            CURRENT_KEY,
            phone
        );

        enterMenu();

        return;
    }

    if(!accounts[phone]){
        message(
            "Номер не зарегистрирован. Сначала создайте аккаунт."
        );
        return;
    }

    if(
        accounts[phone].password !==
        password
    ){
        message("Неверный пароль");
        return;
    }

    localStorage.setItem(
        CURRENT_KEY,
        phone
    );

    enterMenu();
}

$("authButton").onclick=auth;

$("password").addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            auth();
        }
    }
);

/* PROFILE */

$("profileButton").onclick=()=>{

    const current=
        localStorage.getItem(CURRENT_KEY);

    if(!current)return;

    const profiles=getProfiles();
    const profile=profiles[current] || {};

    $("profileNickname").value=
        profile.nickname || "";

    $("profileDescription").value=
        profile.description || "";

    $("profileAvatar").src=
        profile.avatar || "./icon.svg";

    $("profileModal").style.display="flex";
};

$("avatarInput").onchange=e=>{

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=()=>{

        const img=new Image();

        img.onload=()=>{

            const canvas=
                document.createElement("canvas");

            const size=500;

            canvas.width=size;
            canvas.height=size;

            const ctx=
                canvas.getContext("2d");

            const scale=Math.max(
                size/img.width,
                size/img.height
            );

            const width=
                img.width*scale;

            const height=
                img.height*scale;

            const x=(size-width)/2;
            const y=(size-height)/2;

            ctx.drawImage(
                img,
                x,
                y,
                width,
                height
            );

            $("profileAvatar").src=
                canvas.toDataURL(
                    "image/jpeg",
                    .82
                );
        };

        img.src=reader.result;
    };

    reader.readAsDataURL(file);
};

$("saveProfile").onclick=()=>{

    const current=
        localStorage.getItem(CURRENT_KEY);

    if(!current)return;

    const profiles=getProfiles();

    profiles[current]={
        nickname:
            $("profileNickname")
                .value
                .trim() || "Игрок",

        description:
            $("profileDescription")
                .value
                .trim(),

        avatar:
            $("profileAvatar").src
    };

    saveProfiles(profiles);

    updateHUD();

    $("profileModal")
        .style.display="none";
};

/* MODALS */

document
    .querySelectorAll("[data-close]")
    .forEach(button=>{

        button.onclick=()=>{

            $(button.dataset.close)
                .style.display="none";

        };

    });

document
    .querySelectorAll(".modal")
    .forEach(modal=>{

        modal.addEventListener(
            "click",
            e=>{

                if(e.target===modal){
                    modal.style.display="none";
                }

            }
        );

    });

/* SETTINGS */

$("settingsButton").onclick=()=>{
    $("settingsModal")
        .style.display="flex";
};

$("profileLogout").onclick=logout;
$("settingsLogout").onclick=logout;

$("fullscreenButton").onclick=async()=>{

    try{

        if(!document.fullscreenElement){

            await document
                .documentElement
                .requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch{}

};

/* GAME */

$("playButton").onclick=()=>{
    showScreen("game");
};

$("backGame").onclick=()=>{
    enterMenu();
};

/* LOADING */

let progress=0;

const loader=setInterval(()=>{

    progress++;

    $("loaderBar")
        .style.width=
        progress+"%";

    $("loading").textContent=
        "INITIALIZING WORLD "+
        progress+"%";

    if(progress>=100){

        clearInterval(loader);

        setTimeout(()=>{

            const current=
                localStorage.getItem(
                    CURRENT_KEY
                );

            if(current){
                enterMenu();
            }else{
                showScreen("auth");
            }

        },500);

    }

},50);

/* LANDSCAPE */

try{

    if(
        screen.orientation &&
        screen.orientation.lock
    ){
        screen.orientation.lock(
            "landscape"
        );
    }

}catch{}

/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        ()=>{
            navigator.serviceWorker
                .register("./sw.js")
                .catch(()=>{});
        }
    );

}
</script>
