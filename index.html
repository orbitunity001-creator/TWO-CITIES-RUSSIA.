<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TWO CITIES: RUSSIA</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#79d7ff">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #8bdcff;
    color: #10233f;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

#rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: linear-gradient(#65cfff, #f5fdff);
    align-items: center;
    justify-content: center;
    text-align: center;
}

.rotate-box {
    padding: 30px;
}

.rotate-icon {
    font-size: 70px;
    margin-bottom: 20px;
}

.rotate-box h2 {
    font-size: 25px;
    margin-bottom: 10px;
}

.rotate-box p {
    color: #50647d;
}

@media (orientation: portrait) {
    #rotate {
        display: flex;
    }
}

/* DAY WORLD */

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

.sky {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            #63cfff 0%,
            #a8e8ff 48%,
            #eafaff 72%,
            #fff 100%
        );
}

.sun {
    position: absolute;
    width: 190px;
    height: 190px;
    right: 9%;
    top: 7%;
    border-radius: 50%;
    background: #fffbd2;
    box-shadow:
        0 0 40px #fff6a0,
        0 0 100px rgba(255, 239, 107, .65);
}

.cloud {
    position: absolute;
    background: rgba(255,255,255,.92);
    border-radius: 100px;
    filter: blur(.2px);
    box-shadow: 0 8px 20px rgba(52,124,157,.08);
}

.cloud:before,
.cloud:after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud.one {
    width: 190px;
    height: 50px;
    left: 9%;
    top: 15%;
}

.cloud.one:before {
    width: 70px;
    height: 70px;
    left: 28px;
    top: -32px;
}

.cloud.one:after {
    width: 90px;
    height: 90px;
    right: 25px;
    top: -45px;
}

.cloud.two {
    width: 160px;
    height: 42px;
    left: 48%;
    top: 22%;
    opacity: .8;
}

.cloud.two:before {
    width: 60px;
    height: 60px;
    left: 30px;
    top: -25px;
}

.cloud.two:after {
    width: 70px;
    height: 70px;
    right: 20px;
    top: -35px;
}

.cloud.three {
    width: 210px;
    height: 48px;
    right: 22%;
    top: 35%;
    opacity: .55;
}

.cloud.three:before {
    width: 70px;
    height: 70px;
    left: 35px;
    top: -32px;
}

.cloud.three:after {
    width: 80px;
    height: 80px;
    right: 35px;
    top: -38px;
}

/* CITY */

.city {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20%;
    height: 42%;
}

.building {
    position: absolute;
    bottom: 0;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(
        100deg,
        #dcecf5,
        #fff,
        #b9d8e8
    );
    box-shadow: 4px 0 14px rgba(45,101,132,.13);
}

.building:after {
    content: "";
    position: absolute;
    inset: 10px;
    background:
        repeating-linear-gradient(
            to right,
            rgba(52,137,180,.42) 0 10px,
            transparent 10px 22px
        ),
        repeating-linear-gradient(
            to bottom,
            rgba(52,137,180,.35) 0 10px,
            transparent 10px 23px
        );
}

.b1 { left: 0; width: 10%; height: 48%; }
.b2 { left: 8%; width: 12%; height: 76%; }
.b3 { left: 18%; width: 9%; height: 55%; }
.b4 { left: 26%; width: 13%; height: 87%; }
.b5 { left: 38%; width: 10%; height: 62%; }
.b6 { left: 47%; width: 14%; height: 82%; }
.b7 { left: 60%; width: 8%; height: 57%; }
.b8 { left: 67%; width: 12%; height: 76%; }
.b9 { left: 78%; width: 9%; height: 48%; }
.b10 { left: 86%; width: 14%; height: 68%; }

.road {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: -20%;
    height: 46%;
    background:
        linear-gradient(
            84deg,
            #7c8992,
            #b7c0c5 45%,
            #707c84
        );
    clip-path: polygon(39% 0,61% 0,100% 100%,0 100%);
    box-shadow: 0 -12px 35px rgba(50,80,90,.2);
}

.road-line {
    position: absolute;
    left: 48%;
    bottom: 0;
    width: 4%;
    height: 100%;
    transform: perspective(250px) rotateX(20deg);
    background:
        repeating-linear-gradient(
            to bottom,
            #fff 0 35px,
            transparent 35px 75px
        );
    opacity: .9;
}

/* TREES */

.tree {
    position: absolute;
    bottom: 17%;
    width: 45px;
    height: 100px;
}

.tree .trunk {
    position: absolute;
    width: 12px;
    height: 50px;
    left: 17px;
    bottom: 0;
    background: #825631;
    border-radius: 5px;
}

.tree .leaf {
    position: absolute;
    width: 65px;
    height: 65px;
    left: -10px;
    top: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg,#7ee66d,#25ae58);
    box-shadow: inset -8px -10px 18px rgba(0,90,30,.15);
}

.tree .leaf:before,
.tree .leaf:after {
    content: "";
    position: absolute;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #45c964;
}

.tree .leaf:before {
    left: -20px;
    top: 20px;
}

.tree .leaf:after {
    right: -18px;
    top: 15px;
}

.tree.t1 { left: 6%; }
.tree.t2 { left: 18%; transform: scale(.8); }
.tree.t3 { right: 12%; }
.tree.t4 { right: 25%; transform: scale(.72); }

/* TOP */

.topbar {
    position: absolute;
    z-index: 20;
    top: 18px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-small {
    padding: 10px 18px;
    border-radius: 16px;
    background: rgba(255,255,255,.78);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 8px 25px rgba(40,100,140,.13);
    backdrop-filter: blur(15px);
}

.logo-small b {
    font-size: 18px;
    color: #15385d;
}

.logo-small span {
    color: #e6313d;
}

.hud {
    display: none;
    align-items: center;
    gap: 10px;
}

.hud-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    background: #e9f8ff;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.hud-name {
    padding: 10px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,.8);
    font-weight: 700;
}

/* SPLASH */

.screen {
    position: absolute;
    inset: 0;
    z-index: 10;
}

#splash {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.splash-content {
    width: min(650px, 90vw);
    padding: 35px;
}

.car-logo {
    position: relative;
    width: 270px;
    height: 125px;
    margin: 0 auto 20px;
}

.car-body {
    position: absolute;
    width: 230px;
    height: 65px;
    left: 20px;
    bottom: 25px;
    border-radius: 35px 55px 18px 18px;
    background: linear-gradient(
        180deg,
        #ff5360,
        #dc1f32 65%,
        #a90018
    );
    box-shadow:
        0 15px 25px rgba(175,0,20,.3),
        inset 0 4px 8px rgba(255,255,255,.5);
}

.car-roof {
    position: absolute;
    width: 120px;
    height: 55px;
    left: 72px;
    top: 5px;
    border-radius: 70px 70px 5px 5px;
    background: linear-gradient(135deg,#d9f7ff,#5eafd4);
    border: 5px solid #b7182a;
}

.wheel {
    position: absolute;
    width: 43px;
    height: 43px;
    bottom: 5px;
    border-radius: 50%;
    background: #18212b;
    border: 7px solid #fff;
    box-shadow: 0 3px 7px rgba(0,0,0,.4);
}

.wheel.left { left: 42px; }
.wheel.right { right: 42px; }

.wheel:after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background: #b9c5cd;
}

.splash-title {
    font-size: clamp(48px, 8vw, 88px);
    font-weight: 1000;
    letter-spacing: -4px;
    color: #123457;
    text-shadow: 0 5px 0 white;
}

.splash-title span {
    color: #e62b3b;
}

.subtitle {
    margin-top: 5px;
    font-size: clamp(17px, 3vw, 25px);
    font-weight: 800;
    color: #38546d;
    letter-spacing: 4px;
}

.studio {
    margin-top: 14px;
    color: #5d7181;
    font-weight: 700;
}

.loader {
    width: min(440px, 80vw);
    height: 13px;
    margin: 28px auto 0;
    border-radius: 20px;
    background: rgba(255,255,255,.7);
    overflow: hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.08);
}

.loader-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg,#198cff,#e72f42);
    transition: width .1s linear;
}

.loading-text {
    margin-top: 10px;
    color: #527087;
    font-weight: 700;
}

/* AUTH */

#auth {
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.auth-card {
    width: min(460px, 92vw);
    padding: 30px;
    border-radius: 28px;
    background: rgba(255,255,255,.88);
    border: 1px solid white;
    box-shadow: 0 25px 70px rgba(32,86,120,.2);
    backdrop-filter: blur(25px);
}

.auth-title {
    text-align: center;
    font-size: 29px;
    font-weight: 1000;
    color: #153b62;
}

.auth-title span {
    color: #e72f40;
}

.tabs {
    display: flex;
    gap: 8px;
    margin: 25px 0;
    padding: 5px;
    background: #e9f5fa;
    border-radius: 15px;
}

.tab {
    flex: 1;
    border: 0;
    padding: 12px;
    border-radius: 11px;
    background: transparent;
    color: #60788c;
    font-weight: 800;
}

.tab.active {
    background: white;
    color: #e72f40;
    box-shadow: 0 5px 15px rgba(50,100,130,.12);
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: #60798d;
    font-weight: 800;
}

.field input,
.field textarea {
    width: 100%;
    border: 2px solid #e2eef3;
    outline: none;
    border-radius: 14px;
    padding: 14px;
    background: #fafdff;
    color: #16334f;
    transition: .2s;
}

.field textarea {
    min-height: 90px;
    resize: none;
}

.field input:focus,
.field textarea:focus {
    border-color: #51bdf0;
    box-shadow: 0 0 0 4px rgba(81,189,240,.13);
}

.primary {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 15px;
    background: linear-gradient(135deg,#ef3346,#cf1d32);
    color: white;
    font-weight: 900;
    box-shadow: 0 10px 22px rgba(220,35,55,.25);
    transition: .2s;
}

.primary:active {
    transform: scale(.98);
}

.message {
    min-height: 22px;
    margin-top: 12px;
    text-align: center;
    color: #d9283b;
    font-weight: 700;
}

/* MENU */

#menu {
    display: none;
}

.menu-panel {
    position: absolute;
    z-index: 15;
    left: 6%;
    top: 50%;
    transform: translateY(-50%);
    width: min(430px, 45vw);
}

.menu-title {
    font-size: clamp(42px, 6vw, 75px);
    line-height: .9;
    font-weight: 1000;
    color: #143858;
    text-shadow: 0 5px white;
}

.menu-title span {
    color: #e52d40;
}

.menu-city {
    margin: 15px 0 25px;
    color: #4f6c82;
    font-weight: 800;
    letter-spacing: 2px;
}

.menu-buttons {
    display: grid;
    gap: 12px;
}

.menu-btn {
    width: 100%;
    border: 0;
    border-radius: 17px;
    padding: 17px 20px;
    text-align: left;
    font-weight: 900;
    color: #173b59;
    background: rgba(255,255,255,.85);
    box-shadow: 0 10px 28px rgba(30,90,125,.13);
    transition: .2s;
}

.menu-btn:hover {
    transform: translateX(5px);
}

.menu-btn.play {
    color: white;
    background: linear-gradient(135deg,#ed3448,#c91d32);
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(23,58,80,.25);
    backdrop-filter: blur(10px);
}

.modal-card {
    width: min(520px, 94vw);
    max-height: 90vh;
    overflow: auto;
    padding: 28px;
    border-radius: 27px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 30px 90px rgba(25,70,100,.25);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.modal-head h2 {
    color: #183c5c;
}

.close {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: #edf5f8;
    color: #456176;
    font-size: 20px;
}

.avatar-box {
    text-align: center;
    margin-bottom: 20px;
}

.avatar {
    width: 120px;
    height: 120px;
    margin: auto;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
    background: linear-gradient(135deg,#70d6ff,#eafaff);
    box-shadow: 0 10px 30px rgba(40,100,130,.2);
}

.avatar-upload {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 15px;
    border-radius: 12px;
    background: #eaf7fc;
    color: #25739a;
    font-weight: 800;
    cursor: pointer;
}

.avatar-upload input {
    display: none;
}

.secondary {
    width: 100%;
    border: 0;
    padding: 14px;
    border-radius: 14px;
    background: #edf5f8;
    color: #36566d;
    font-weight: 900;
    margin-top: 10px;
}

.danger {
    width: 100%;
    border: 0;
    padding: 14px;
    border-radius: 14px;
    background: #ffe8eb;
    color: #d82b3c;
    font-weight: 900;
    margin-top: 10px;
}

/* GAME PLACEHOLDER */

#game {
    display: none;
}

.game-info {
    position: absolute;
    left: 25px;
    bottom: 25px;
    z-index: 30;
    padding: 18px 22px;
    border-radius: 18px;
    background: rgba(255,255,255,.86);
    box-shadow: 0 10px 30px rgba(30,80,110,.15);
}

.game-info b {
    color: #df293c;
}

.back-game {
    position: absolute;
    right: 25px;
    bottom: 25px;
    z-index: 30;
    border: 0;
    border-radius: 15px;
    padding: 13px 20px;
    background: white;
    color: #183b59;
    font-weight: 900;
}

/* MOBILE */

@media (max-width: 800px) {
    .menu-panel {
        left: 5%;
        width: 50vw;
    }

    .menu-title {
        font-size: 42px;
    }

    .sun {
        width: 130px;
        height: 130px;
    }
}
</style>
</head>

<body>

<div id="rotate">
    <div class="rotate-box">
        <div class="rotate-icon">📱↔️</div>
        <h2>ПОВЕРНИТЕ ТЕЛЕФОН</h2>
        <p>Игра работает в горизонтальном режиме</p>
    </div>
</div>

<div id="app">

    <div class="sky"></div>
    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="city">
        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>
        <div class="building b6"></div>
        <div class="building b7"></div>
        <div class="building b8"></div>
        <div class="building b9"></div>
        <div class="building b10"></div>
    </div>

    <div class="tree t1">
        <div class="leaf"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree t2">
        <div class="leaf"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree t3">
        <div class="leaf"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree t4">
        <div class="leaf"></div>
        <div class="trunk"></div>
    </div>

    <div class="road">
        <div class="road-line"></div>
    </div>

    <div class="topbar">
        <div class="logo-small">
            <b>TWO CITIES <span>RUSSIA</span></b>
        </div>

        <div class="hud" id="hud">
            <img id="hudAvatar" class="hud-avatar" src="./icon.svg">
            <div class="hud-name" id="hudName">Игрок</div>
        </div>
    </div>

    <!-- SPLASH -->

    <section id="splash" class="screen">

        <div class="splash-content">

            <div class="car-logo">

                <div class="car-roof"></div>

                <div class="car-body"></div>

                <div class="wheel left"></div>
                <div class="wheel right"></div>

            </div>

            <div class="splash-title">
                TWO CITIES <span>RUSSIA</span>
            </div>

            <div class="subtitle">
                MOSCOW • KRASNODAR
            </div>

            <div class="studio">
                Cats Developer Studio Game
            </div>

            <div class="loader">
                <div class="loader-bar" id="loaderBar"></div>
            </div>

            <div class="loading-text" id="loadingText">
                Загрузка города... 0%
            </div>

        </div>

    </section>

    <!-- AUTH -->

    <section id="auth" class="screen">

        <div class="auth-card">

            <div class="auth-title">
                TWO CITIES <span>RUSSIA</span>
            </div>

            <div class="tabs">
                <button class="tab active" id="loginTab">
                    ВХОД
                </button>

                <button class="tab" id="registerTab">
                    РЕГИСТРАЦИЯ
                </button>
            </div>

            <div id="authForm">

                <div class="field">
                    <label>НОМЕР ТЕЛЕФОНА</label>
                    <input
                        id="phone"
                        type="tel"
                        placeholder="+7 900 000-00-00"
                        autocomplete="tel">
                </div>

                <div class="field" id="nicknameField" style="display:none;">
                    <label>НИКНЕЙМ</label>
                    <input
                        id="nickname"
                        type="text"
                        placeholder="Введите никнейм"
                        maxlength="24">
                </div>

                <div class="field">
                    <label>ПАРОЛЬ</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password">
                </div>

                <button class="primary" id="authButton">
                    ВОЙТИ В ИГРУ
                </button>

                <div class="message" id="authMessage"></div>

            </div>

        </div>

    </section>

    <!-- MENU -->

    <section id="menu" class="screen">

        <div class="menu-panel">

            <div class="menu-title">
                TWO<br>
                CITIES<br>
                <span>RUSSIA</span>
            </div>

            <div class="menu-city">
                МОСКВА • КРАСНОДАР
            </div>

            <div class="menu-buttons">

                <button class="menu-btn play" id="playButton">
                    ▶ ИГРАТЬ
                </button>

                <button class="menu-btn" id="profileButton">
                    👤 ПРОФИЛЬ
                </button>

                <button class="menu-btn" id="settingsButton">
                    ⚙️ НАСТРОЙКИ
                </button>

            </div>

        </div>

    </section>

    <!-- GAME -->

    <section id="game" class="screen">

        <div class="game-info">
            <b>TWO CITIES: RUSSIA</b><br>
            Москва • район города
        </div>

        <button class="back-game" id="backGame">
            ← МЕНЮ
        </button>

    </section>

</div>

<!-- PROFILE -->

<div class="modal" id="profileModal">

    <div class="modal-card">

        <div class="modal-head">
            <h2>Профиль</h2>
            <button class="close" data-close="profileModal">×</button>
        </div>

        <div class="avatar-box">

            <img
                id="profileAvatar"
                class="avatar"
                src="./icon.svg">

            <label class="avatar-upload">
                📷 Выбрать аватар
                <input
                    id="avatarInput"
                    type="file"
                    accept="image/*">
            </label>

        </div>

        <div class="field">
            <label>НИКНЕЙМ</label>
            <input
                id="profileNickname"
                maxlength="24"
                placeholder="Ваш никнейм">
        </div>

        <div class="field">
            <label>О СЕБЕ</label>
            <textarea
                id="profileDescription"
                maxlength="180"
                placeholder="Расскажите о себе..."></textarea>
        </div>

        <button class="primary" id="saveProfile">
            СОХРАНИТЬ
        </button>

        <button class="danger" id="profileLogout">
            ВЫЙТИ ИЗ АККАУНТА
        </button>

    </div>

</div>

<!-- SETTINGS -->

<div class="modal" id="settingsModal">

    <div class="modal-card">

        <div class="modal-head">
            <h2>Настройки</h2>
            <button class="close" data-close="settingsModal">×</button>
        </div>

        <button class="secondary" id="fullscreenButton">
            ⛶ Полный экран
        </button>

        <button class="danger" id="settingsLogout">
            ВЫЙТИ ИЗ АККАУНТА
        </button>

    </div>

</div>

<script>
const ACCOUNTS_KEY = "two_cities_accounts_v2";
const PROFILES_KEY = "two_cities_profiles_v2";
const CURRENT_KEY = "two_cities_current_v2";

let mode = "login";

const $ = id => document.getElementById(id);

function getAccounts() {
    try {
        return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {};
    } catch {
        return {};
    }
}

function saveAccounts(accounts) {
    localStorage.setItem(
        ACCOUNTS_KEY,
        JSON.stringify(accounts)
    );
}

function getProfiles() {
    try {
        return JSON.parse(localStorage.getItem(PROFILES_KEY)) || {};
    } catch {
        return {};
    }
}

function saveProfiles(profiles) {
    localStorage.setItem(
        PROFILES_KEY,
        JSON.stringify(profiles)
    );
}

function normalizePhone(phone) {
    return phone
        .replace(/[^\d+]/g, "")
        .replace(/^8/, "+7")
        .replace(/^7/, "+7");
}

function showScreen(name) {
    ["splash", "auth", "menu", "game"].forEach(id => {
        $(id).style.display = "none";
    });

    if (name === "splash") {
        $("splash").style.display = "flex";
    }

    if (name === "auth") {
        $("auth").style.display = "flex";
    }

    if (name === "menu") {
        $("menu").style.display = "block";
    }

    if (name === "game") {
        $("game").style.display = "block";
    }
}

function setMessage(text) {
    $("authMessage").textContent = text;
}

function updateHUD() {

    const current = localStorage.getItem(CURRENT_KEY);

    if (!current) {
        $("hud").style.display = "none";
        return;
    }

    const profiles = getProfiles();
    const profile = profiles[current] || {};

    $("hudName").textContent =
        profile.nickname || "Игрок";

    $("hudAvatar").src =
        profile.avatar || "./icon.svg";

    $("hud").style.display = "flex";
}

function enterMenu() {
    updateHUD();
    showScreen("menu");
}

function logout() {
    localStorage.removeItem(CURRENT_KEY);
    $("phone").value = "";
    $("password").value = "";
    $("nickname").value = "";
    setMessage("");
    updateHUD();
    showScreen("auth");
}

function submitAuth() {

    const phone = normalizePhone(
        $("phone").value.trim()
    );

    const password =
        $("password").value;

    const nickname =
        $("nickname").value.trim();

    if (!phone) {
        setMessage("Введите номер телефона");
        return;
    }

    if (!password) {
        setMessage("Введите пароль");
        return;
    }

    const accounts = getAccounts();
    const profiles = getProfiles();

    if (mode === "register") {

        if (accounts[phone]) {
            setMessage(
                "Этот номер телефона уже зарегистрирован"
            );
            return;
        }

        if (!nickname) {
            setMessage("Введите никнейм");
            return;
        }

        if (password.length < 4) {
            setMessage(
                "Пароль должен содержать минимум 4 символа"
            );
            return;
        }

        accounts[phone] = {
            password: password
        };

        profiles[phone] = {
            nickname: nickname,
            description: "",
            avatar: "./icon.svg"
        };

        saveAccounts(accounts);
        saveProfiles(profiles);

        localStorage.setItem(
            CURRENT_KEY,
            phone
        );

        enterMenu();
        return;
    }

    if (!accounts[phone]) {
        setMessage(
            "Номер не зарегистрирован. Сначала создайте аккаунт."
        );
        return;
    }

    if (accounts[phone].password !== password) {
        setMessage("Неверный пароль");
        return;
    }

    localStorage.setItem(
        CURRENT_KEY,
        phone
    );

    enterMenu();
}

/* TABS */

$("loginTab").onclick = () => {

    mode = "login";

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");

    $("nicknameField").style.display = "none";

    $("authButton").textContent =
        "ВОЙТИ В ИГРУ";

    setMessage("");
};

$("registerTab").onclick = () => {

    mode = "register";

    $("registerTab").classList.add("active");
    $("loginTab").classList.remove("active");

    $("nicknameField").style.display = "block";

    $("authButton").textContent =
        "СОЗДАТЬ АККАУНТ";

    setMessage("");
};

$("authButton").onclick = submitAuth;

$("password").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        submitAuth();
    }
});

/* PROFILE */

$("profileButton").onclick = () => {

    const current =
        localStorage.getItem(CURRENT_KEY);

    if (!current) return;

    const profiles = getProfiles();
    const profile = profiles[current] || {};

    $("profileNickname").value =
        profile.nickname || "";

    $("profileDescription").value =
        profile.description || "";

    $("profileAvatar").src =
        profile.avatar || "./icon.svg";

    $("profileModal").style.display = "flex";
};

$("avatarInput").onchange = event => {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = () => {

        const img =
            new Image();

        img.onload = () => {

            const canvas =
                document.createElement("canvas");

            const size = 500;

            canvas.width = size;
            canvas.height = size;

            const ctx =
                canvas.getContext("2d");

            const scale =
                Math.max(
                    size / img.width,
                    size / img.height
                );

            const w =
                img.width * scale;

            const h =
                img.height * scale;

            const x =
                (size - w) / 2;

            const y =
                (size - h) / 2;

            ctx.drawImage(
                img,
                x,
                y,
                w,
                h
            );

            const compressed =
                canvas.toDataURL(
                    "image/jpeg",
                    .82
                );

            $("profileAvatar").src =
                compressed;
        };

        img.src = reader.result;
    };

    reader.readAsDataURL(file);
};

$("saveProfile").onclick = () => {

    const current =
        localStorage.getItem(CURRENT_KEY);

    if (!current) return;

    const profiles =
        getProfiles();

    const old =
        profiles[current] || {};

    profiles[current] = {
        nickname:
            $("profileNickname").value.trim()
            || "Игрок",

        description:
            $("profileDescription").value.trim(),

        avatar:
            $("profileAvatar").src
            || old.avatar
            || "./icon.svg"
    };

    saveProfiles(profiles);

    updateHUD();

    $("profileModal").style.display = "none";
};

/* MODALS */

document.querySelectorAll("[data-close]").forEach(btn => {

    btn.onclick = () => {

        const id =
            btn.dataset.close;

        $(id).style.display = "none";
    };

});

document.querySelectorAll(".modal").forEach(modal => {

    modal.addEventListener("click", e => {

        if (e.target === modal) {
            modal.style.display = "none";
        }

    });

});

/* SETTINGS */

$("settingsButton").onclick = () => {
    $("settingsModal").style.display = "flex";
};

$("profileLogout").onclick = logout;
$("settingsLogout").onclick = logout;

$("fullscreenButton").onclick = async () => {

    try {

        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }

    } catch {}
};

/* GAME */

$("playButton").onclick = () => {

    showScreen("game");

};

$("backGame").onclick = () => {

    enterMenu();

};

/* SPLASH */

let progress = 0;

const loadingTimer =
    setInterval(() => {

        progress++;

        $("loaderBar").style.width =
            progress + "%";

        $("loadingText").textContent =
            "Загрузка города... " +
            progress + "%";

        if (progress >= 100) {

            clearInterval(loadingTimer);

            setTimeout(() => {

                const current =
                    localStorage.getItem(
                        CURRENT_KEY
                    );

                if (current) {
                    enterMenu();
                } else {
                    showScreen("auth");
                }

            }, 400);

        }

    }, 50);

/* ORIENTATION */

async function lockLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {
            await screen.orientation.lock(
                "landscape"
            );
        }

    } catch {}

}

lockLandscape();

/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register(
            "./sw.js"
        ).catch(() => {});

    });

}
</script>

</body>
</html>
