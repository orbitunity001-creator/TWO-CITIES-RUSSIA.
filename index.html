<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>AVIA</title>

<meta name="theme-color" content="#040812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;

    overflow:hidden;

    background:#040812;
    color:#fff;

    font-family:Arial,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

/* =========================
   ЗАСТАВКА
========================= */

#splash{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 42%,
            #102b50 0%,
            #071326 32%,
            #040812 72%
        );

    transition:opacity .5s ease;
}

/* ЗВЁЗДЫ */

.stars{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:.6;

    animation:
        twinkle 2.5s
        infinite
        ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}

/* СВЕЧЕНИЕ */

.glow{
    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    background:#1675ed;

    filter:blur(90px);

    opacity:.18;

    animation:glowMove 3s
        ease-in-out
        infinite;
}

@keyframes glowMove{

    0%,100%{
        transform:scale(.9);
        opacity:.12;
    }

    50%{
        transform:scale(1.15);
        opacity:.25;
    }
}

/* ПТИЦА */

.bird-wrap{
    position:relative;

    width:min(62vw,270px);
    height:min(62vw,270px);

    display:flex;
    align-items:center;
    justify-content:center;

    animation:
        birdFly 3s
        ease-in-out
        infinite;
}

.bird{
    width:100%;
    height:100%;

    display:block;

    filter:
        drop-shadow(0 20px 35px #0009);
}

/* КРЫЛЬЯ */

.left-wing{
    transform-origin:220px 230px;

    animation:
        leftWing .75s
        ease-in-out
        infinite;
}

.right-wing{
    transform-origin:285px 245px;

    animation:
        rightWing .75s
        ease-in-out
        infinite;
}

@keyframes leftWing{

    0%,100%{
        transform:rotate(5deg);
    }

    50%{
        transform:rotate(-14deg);
    }
}

@keyframes rightWing{

    0%,100%{
        transform:rotate(-5deg);
    }

    50%{
        transform:rotate(14deg);
    }
}

@keyframes birdFly{

    0%,100%{
        transform:translateY(5px);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* =========================
   НАЗВАНИЕ НА ЗАСТАВКЕ
========================= */

.splash-title{
    position:absolute;

    bottom:88px;

    width:100%;

    text-align:center;

    font-size:clamp(48px,14vw,72px);
    line-height:1;

    font-weight:900;

    letter-spacing:
        clamp(7px,2.5vw,12px);

    text-shadow:
        0 5px 30px #1675ed66;

    animation:titleIn 1.5s ease forwards;
}

.splash-studio{
    position:absolute;

    bottom:48px;

    width:100%;

    text-align:center;

    color:#71839c;

    font-size:14px;

    letter-spacing:.5px;

    animation:titleIn 1.8s ease forwards;
}

@keyframes titleIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   ОСНОВНОЕ ПРИЛОЖЕНИЕ
========================= */

#app{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(18px,env(safe-area-inset-bottom))
        18px;

    overflow:hidden;

    opacity:0;
    pointer-events:none;

    transition:opacity .5s ease;

    background:
        radial-gradient(
            circle at 50% 20%,
            #0b1d35 0%,
            #040812 58%
        );
}

#app.visible{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   КАРТОЧКА ВХОДА
========================= */

.auth-card{

    position:relative;

    width:100%;
    max-width:390px;

    max-height:calc(100vh - 36px);

    padding:
        28px
        20px
        24px;

    border-radius:26px;

    background:#0c1729ef;

    border:1px solid #263852;

    box-shadow:
        0 30px 90px #0009,
        inset 0 1px 0 #ffffff0a;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    animation:cardIn .7s ease;

    overflow:hidden;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* ЛОГО */

.auth-logo{

    width:72px;
    height:72px;

    margin:
        0 auto
        17px;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 15px 40px #1675ed40;
}

.auth-logo img{

    width:100%;
    height:100%;

    display:block;
}

/* ЗАГОЛОВОК */

.auth-title{

    width:100%;

    text-align:center;

    font-size:30px;

    font-weight:900;

    letter-spacing:3px;
}

.auth-subtitle{

    margin-top:8px;

    width:100%;

    text-align:center;

    color:#8495ad;

    font-size:14px;

    line-height:1.5;
}

/* КРЕСТИК */

.skip{

    position:absolute;

    top:13px;
    right:13px;

    width:38px;
    height:38px;

    padding:0;

    border:0;

    border-radius:50%;

    background:#17243a;

    color:#9aabc0;

    font-size:22px;

    line-height:38px;

    text-align:center;

    cursor:pointer;
}

.skip:active{
    transform:scale(.9);
}

/* КНОПКИ */

.auth-buttons{

    width:100%;

    margin-top:25px;

    display:flex;
    flex-direction:column;

    gap:11px;
}

.auth-button{

    width:100%;

    min-height:54px;

    padding:15px;

    border:0;

    border-radius:15px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.auth-button:active{

    transform:scale(.98);
}

.login{

    background:#1675ed;

    color:white;

    box-shadow:
        0 10px 30px #1675ed35;
}

.register{

    background:#18263b;

    color:#eaf3ff;

    border:1px solid #2a3d58;
}

.auth-note{

    width:100%;

    margin-top:18px;

    text-align:center;

    color:#566b86;

    font-size:12px;

    line-height:1.45;
}

/* =========================
   СООБЩЕНИЕ
========================= */

#message{

    position:fixed;

    left:18px;
    right:18px;

    bottom:
        max(20px,env(safe-area-inset-bottom));

    z-index:20000;

    display:none;

    padding:16px 18px;

    border-radius:16px;

    text-align:center;

    background:#101d31;

    border:1px solid #293d59;

    color:#aab9cc;

    box-shadow:0 15px 45px #0008;

    animation:messageIn .35s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   ОЧЕНЬ УЗКИЕ ТЕЛЕФОНЫ
========================= */

@media(max-width:360px){

    .bird-wrap{
        width:210px;
        height:210px;
    }

    .splash-title{
        bottom:78px;
        font-size:48px;
    }

    .splash-studio{
        bottom:40px;
        font-size:12px;
    }

    .auth-card{
        padding:
            23px
            17px
            20px;
    }

    .auth-logo{
        width:64px;
        height:64px;
        margin-bottom:14px;
    }

    .auth-title{
        font-size:27px;
    }

    .auth-buttons{
        margin-top:21px;
    }
}
</style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splash">

    <div class="stars">

        <span class="star" style="left:8%;top:15%;animation-delay:.2s"></span>
        <span class="star" style="left:18%;top:34%;animation-delay:1s"></span>
        <span class="star" style="left:29%;top:12%;animation-delay:.5s"></span>
        <span class="star" style="left:42%;top:23%;animation-delay:1.3s"></span>
        <span class="star" style="left:55%;top:10%;animation-delay:.7s"></span>
        <span class="star" style="left:68%;top:29%;animation-delay:1.5s"></span>
        <span class="star" style="left:81%;top:16%;animation-delay:.4s"></span>
        <span class="star" style="left:92%;top:39%;animation-delay:1.1s"></span>

        <span class="star" style="left:12%;top:63%;animation-delay:1.7s"></span>
        <span class="star" style="left:24%;top:77%;animation-delay:.8s"></span>
        <span class="star" style="left:38%;top:61%;animation-delay:1.2s"></span>
        <span class="star" style="left:51%;top:72%;animation-delay:.3s"></span>
        <span class="star" style="left:65%;top:59%;animation-delay:1.8s"></span>
        <span class="star" style="left:78%;top:75%;animation-delay:.9s"></span>
        <span class="star" style="left:90%;top:64%;animation-delay:1.4s"></span>

        <span class="star" style="left:5%;top:48%;animation-delay:.6s"></span>
        <span class="star" style="left:96%;top:52%;animation-delay:1.6s"></span>

    </div>

    <div class="glow"></div>

    <div class="bird-wrap">

        <svg
            class="bird"
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

                <linearGradient
                    id="body"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#ffffff"/>

                    <stop
                        offset=".65"
                        stop-color="#e8f5ff"/>

                    <stop
                        offset="1"
                        stop-color="#a8d8ff"/>

                </linearGradient>

                <linearGradient
                    id="wing"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#ffffff"/>

                    <stop
                        offset=".55"
                        stop-color="#d8edff"/>

                    <stop
                        offset="1"
                        stop-color="#75baff"/>

                </linearGradient>

                <linearGradient
                    id="blue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#8bd5ff"/>

                    <stop
                        offset=".55"
                        stop-color="#4ca9ff"/>

                    <stop
                        offset="1"
                        stop-color="#1675ed"/>

                </linearGradient>

            </defs>

            <!-- Нижнее крыло -->

            <path
                class="left-wing"
                d="M250 300
                C215 325 174 350 145 381
                C121 406 108 430 103 453
                C137 431 170 414 205 405
                C242 396 274 382 302 363Z"
                fill="url(#blue)"
            />

            <!-- Верхнее крыло -->

            <path
                class="right-wing"
                d="M279 267
                C299 238 306 207 291 180
                C271 143 232 124 190 111
                C150 99 119 82 86 58
                C87 103 98 143 122 175
                C151 214 193 235 236 249
                C255 255 270 261 279 267Z"
                fill="url(#wing)"
            />

            <path
                d="M89 183
                C126 201 165 213 208 225
                C248 236 276 251 286 272
                C272 293 246 307 216 311
                C175 306 136 288 109 262
                C92 245 80 216 89 183Z"
                fill="url(#blue)"
            />

            <!-- Тело -->

            <path
                d="M283 248
                C295 203 318 166 350 153
                C379 141 403 151 424 168
                C440 181 455 187 474 190
                C452 204 430 211 416 229
                C402 247 398 277 388 307
                C375 346 350 371 314 385
                C282 398 247 398 211 407
                C232 386 253 365 272 344
                C293 320 305 286 283 248Z"
                fill="url(#body)"
            />

            <path
                d="M347 153
                C369 141 393 149 414 166
                C432 180 452 187 474 190
                C452 202 431 207 414 220
                C402 199 383 186 360 182Z"
                fill="#f7fbff"
            />

            <!-- Глаз -->

            <circle
                cx="397"
                cy="183"
                r="12"
                fill="#07152d"
            />

            <circle
                cx="401"
                cy="179"
                r="3"
                fill="white"
            />

        </svg>

    </div>

    <div class="splash-title">
        AVIA
    </div>

    <div class="splash-studio">
        Cats Developer Studio
    </div>

</div>


<!-- =========================
     ЭКРАН ВХОДА
========================= -->

<div id="app">

    <div class="auth-card">

        <button
            class="skip"
            id="skipButton">
            ×
        </button>

        <div class="auth-logo">
            <img
                src="./icon.svg"
                alt="AVIA">
        </div>

        <div class="auth-title">
            AVIA
        </div>

        <div class="auth-subtitle">
            Войдите или зарегистрируйтесь,<br>
            чтобы продолжить
        </div>

        <div class="auth-buttons">

            <button
                class="auth-button login"
                id="loginButton">
                Войти
            </button>

            <button
                class="auth-button register"
                id="registerButton">
                Зарегистрироваться
            </button>

        </div>

        <div class="auth-note">
            Ваш аккаунт позволит сохранять<br>
            историю общения с AVIA
        </div>

    </div>

</div>


<!-- =========================
     СООБЩЕНИЕ
========================= -->

<div id="message">
    Этот раздел ещё не готов
</div>


<script>

/* =========================
   5 СЕКУНД ЗАСТАВКИ
========================= */

const splash =
    document.getElementById("splash");

const app =
    document.getElementById("app");

setTimeout(() => {

    splash.style.opacity = "0";

    setTimeout(() => {

        splash.style.display = "none";

        app.classList.add("visible");

    },500);

},5000);


/* =========================
   СООБЩЕНИЕ
========================= */

const message =
    document.getElementById("message");

function showMessage(text){

    message.textContent = text;

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    },3000);
}


/* =========================
   ПРОПУСТИТЬ
========================= */

document
    .getElementById("skipButton")
    .addEventListener("click",() => {

        app.style.opacity = "0";

        setTimeout(() => {

            app.style.display = "none";

            showMessage(
                "Этот раздел ещё не готов"
            );

        },300);

    });


/* =========================
   ВХОД
========================= */

document
    .getElementById("loginButton")
    .addEventListener("click",() => {

        showMessage(
            "Раздел входа ещё не готов"
        );

    });


/* =========================
   РЕГИСТРАЦИЯ
========================= */

document
    .getElementById("registerButton")
    .addEventListener("click",() => {

        showMessage(
            "Регистрация ещё не готова"
        );

    });


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

    window.addEventListener("load",() => {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(error => {

                console.error(
                    "Service Worker:",
                    error
                );

            });

    });

}

</script>

</body>
</html>
