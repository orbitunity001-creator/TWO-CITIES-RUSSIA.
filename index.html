<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#1677e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>Nexgram</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f4ff;
    color:#142b44;
}

body{
    overflow:hidden;
}

.app{
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;

    background:
        radial-gradient(circle at 100% 0%,#b9e3ff 0,transparent 35%),
        radial-gradient(circle at 0% 100%,#d2edff 0,transparent 40%),
        linear-gradient(145deg,#f1faff,#dcefff);
}

/* HEADER */

.header{
    padding:13px 14px 10px;
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:53px;
    height:53px;
    flex:0 0 53px;
    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(145deg,#20a0ff,#0866d8);

    box-shadow:
        0 9px 25px rgba(10,112,220,.28);

    position:relative;
    overflow:hidden;
}

.logo::after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:rgba(255,255,255,.13);
    top:-34px;
    right:-27px;
}

/* Оригинальный символ Nexgram */
.nex-symbol{
    position:relative;
    width:29px;
    height:29px;
    z-index:2;
}

.nex-symbol::before{
    content:"";
    position:absolute;
    width:23px;
    height:15px;
    border:5px solid white;
    border-radius:15px 15px 5px 15px;
    transform:rotate(-35deg);
    top:4px;
    left:1px;
}

.nex-symbol::after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    background:white;
    border-radius:50%;
    right:1px;
    bottom:2px;
}

.brand{
    flex:1;
    min-width:0;
}

.brand-name{
    font-size:21px;
    font-weight:900;
    letter-spacing:-.5px;
}

.brand-status{
    margin-top:3px;
    font-size:12px;
    font-weight:600;
    color:#66839d;
}

/* INSTALL */

#installBtn{
    display:none;

    border:0;
    outline:0;

    padding:12px 14px;
    border-radius:15px;

    color:white;
    background:linear-gradient(135deg,#168eff,#0868da);

    font-size:13px;
    font-weight:900;

    box-shadow:0 7px 18px rgba(9,112,222,.25);

    cursor:pointer;
}

#installBtn:active{
    transform:scale(.95);
}

/* SEARCH */

.search{
    margin:2px 14px 12px;
    height:48px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:0 16px;

    border-radius:17px;

    background:rgba(255,255,255,.78);

    border:1px solid rgba(255,255,255,.9);

    box-shadow:0 7px 24px rgba(35,120,170,.08);
}

.search-icon{
    font-size:20px;
    color:#4e7a9d;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;

    font-size:15px;
    color:#17334e;
}

.search input::placeholder{
    color:#7893a9;
}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;
    padding:0 14px 100px;
}

.section{
    margin:5px 4px 10px;

    font-size:13px;
    font-weight:900;

    color:#68849b;
}

.chat{
    width:100%;

    border:0;

    display:flex;
    align-items:center;

    gap:12px;

    padding:13px;

    margin-bottom:9px;

    border-radius:20px;

    background:rgba(255,255,255,.84);

    box-shadow:
        0 8px 25px rgba(39,117,158,.09);

    text-align:left;

    cursor:pointer;
}

.chat:active{
    transform:scale(.985);
}

.chat-avatar{
    width:55px;
    height:55px;
    flex:0 0 55px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(145deg,#20a0ff,#0866d8);

    box-shadow:0 7px 17px rgba(8,105,215,.23);
}

.mini-symbol{
    position:relative;
    width:25px;
    height:25px;
}

.mini-symbol::before{
    content:"";
    position:absolute;
    width:20px;
    height:13px;
    border:4px solid white;
    border-radius:14px 14px 4px 14px;
    transform:rotate(-35deg);
    top:4px;
    left:1px;
}

.mini-symbol::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    right:1px;
    bottom:2px;
}

.chat-info{
    min-width:0;
    flex:1;
}

.chat-name{
    font-size:16px;
    font-weight:900;
}

.verify{
    color:#168af5;
}

.chat-text{
    margin-top:4px;

    font-size:13px;
    color:#718ba1;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    align-self:flex-start;
    font-size:11px;
    color:#7991a5;
}

/* EMPTY */

.empty{
    padding:45px 20px;
    text-align:center;
    color:#718ca2;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty-title{
    font-size:17px;
    font-weight:900;
    color:#28445e;
}

.empty-text{
    margin-top:7px;
    font-size:13px;
    line-height:1.5;
}

/* PROFILE */

.profile{
    display:none;
    padding:15px 14px 100px;
}

.profile-card{
    background:rgba(255,255,255,.85);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(40,120,160,.1);
}

.profile-logo{
    width:85px;
    height:85px;
    margin:auto;

    border-radius:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(145deg,#20a0ff,#0866d8);
}

.profile-name{
    margin-top:14px;
    font-size:21px;
    font-weight:900;
}

.profile-info{
    margin-top:5px;
    color:#7791a6;
    font-size:13px;
}

/* BOTTOM */

.bottom{
    position:fixed;

    left:10px;
    right:10px;
    bottom:10px;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    border-radius:25px;

    background:rgba(255,255,255,.9);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 12px 35px rgba(34,113,151,.16);
}

.nav{
    border:0;
    background:transparent;

    min-width:70px;

    padding:7px 10px;

    border-radius:17px;

    color:#7892a7;

    cursor:pointer;
}

.nav.active{
    background:#e0f2ff;
    color:#087cf0;
}

.nav-icon{
    display:block;
    font-size:21px;
}

.nav-text{
    display:block;
    margin-top:3px;
    font-size:10px;
    font-weight:800;
}

@media(max-width:430px){

    .brand-name{
        font-size:19px;
    }

    #installBtn{
        padding:11px 10px;
        font-size:12px;
    }

}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            <div class="nex-symbol"></div>
        </div>

        <div class="brand">

            <div class="brand-name">
                Nexgram
            </div>

            <div class="brand-status">
                Messenger
            </div>

        </div>

        <button id="installBtn">
            Установить
        </button>

    </header>


    <main class="content" id="chats">

        <div class="search">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                type="text"
                placeholder="Поиск"
                autocomplete="off"
            >

        </div>


        <div class="section">
            Чаты
        </div>


        <button class="chat">

            <div class="chat-avatar">
                <div class="mini-symbol"></div>
            </div>

            <div class="chat-info">

                <div class="chat-name">
                    Nexgram News
                    <span class="verify">✓</span>
                </div>

                <div class="chat-text">
                    Новости и обновления Nexgram
                </div>

            </div>

            <div class="chat-time">
                сегодня
            </div>

        </button>


        <div class="empty">

            <div class="empty-icon">
                💬
            </div>

            <div class="empty-title">
                Начните общение
            </div>

            <div class="empty-text">
                Ваши личные чаты и группы появятся здесь.
            </div>

        </div>

    </main>


    <section class="profile" id="profile">

        <div class="profile-card">

            <div class="profile-logo">
                <div class="nex-symbol"></div>
            </div>

            <div class="profile-name">
                Nexgram User
            </div>

            <div class="profile-info">
                Ваш профиль Nexgram
            </div>

        </div>

    </section>


    <nav class="bottom">

        <button class="nav active" id="chatNav">

            <span class="nav-icon">💬</span>
            <span class="nav-text">Чаты</span>

        </button>


        <button class="nav" id="profileNav">

            <span class="nav-icon">👤</span>
            <span class="nav-text">Профиль</span>

        </button>

    </nav>

</div>


<script>

/* =========================================
   PWA INSTALL
========================================= */

let deferredPrompt = null;

const installBtn =
    document.getElementById("installBtn");


window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredPrompt = event;

        installBtn.style.display = "block";
    }
);


installBtn.addEventListener(
    "click",
    async () => {

        if (!deferredPrompt) {

            alert(
                "Установка пока недоступна. Откройте Nexgram в Chrome через HTTPS."
            );

            return;
        }

        deferredPrompt.prompt();

        const result =
            await deferredPrompt.userChoice;

        if(result.outcome === "accepted"){
            installBtn.style.display = "none";
        }

        deferredPrompt = null;
    }
);


window.addEventListener(
    "appinstalled",
    () => {
        installBtn.style.display = "none";
    }
);


/* =========================================
   NAVIGATION
========================================= */

const chats =
    document.getElementById("chats");

const profile =
    document.getElementById("profile");

const chatNav =
    document.getElementById("chatNav");

const profileNav =
    document.getElementById("profileNav");


chatNav.onclick = () => {

    chats.style.display = "block";
    profile.style.display = "none";

    chatNav.classList.add("active");
    profileNav.classList.remove("active");
};


profileNav.onclick = () => {

    chats.style.display = "none";
    profile.style.display = "block";

    profileNav.classList.add("active");
    chatNav.classList.remove("active");
};


/* =========================================
   SEARCH
========================================= */

const search =
    document.getElementById("search");

const mainChat =
    document.querySelector(".chat");


search.addEventListener(
    "input",
    () => {

        const value =
            search.value
                .toLowerCase()
                .trim();

        const text =
            mainChat.innerText.toLowerCase();

        mainChat.style.display =
            !value || text.includes(value)
                ? "flex"
                : "none";
    }
);


/* =========================================
   SERVICE WORKER
========================================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js")
                .catch(
                    error =>
                        console.log(
                            "Service Worker:",
                            error
                        )
                );

        }
    );

}

</script>

</body>
</html>
