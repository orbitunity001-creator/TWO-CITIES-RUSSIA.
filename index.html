<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>AVIA</title>

<meta name="theme-color" content="#040812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>

/* ================================
   ОСНОВА
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}

html,
body{

    width:100%;
    height:100%;

    min-height:100%;

    overflow:hidden;

    overscroll-behavior:none;

    background:#040812;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;
}

body{
    color:#fff;
}


/* ================================
   ЭКРАН ЗАГРУЗКИ
================================ */

#splash{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    min-height:100vh;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #102b50 0%,
            #071326 38%,
            #040812 80%
        );

    z-index:9999;

    transition:
        opacity .6s ease;
}


/* ================================
   СВЕЧЕНИЕ ЗА ПТИЦЕЙ
================================ */

.glow{

    position:absolute;

    width:380px;
    height:380px;

    border-radius:50%;

    background:#1675ed;

    filter:blur(110px);

    opacity:.20;

    animation:
        glowPulse
        3s
        ease-in-out
        infinite;
}

@keyframes glowPulse{

    0%,
    100%{
        transform:scale(.9);
        opacity:.12;
    }

    50%{
        transform:scale(1.12);
        opacity:.25;
    }
}


/* ================================
   ПТИЦА
================================ */

.bird-wrap{

    position:absolute;

    width:min(88vw,390px);
    height:min(88vw,390px);

    left:50%;
    top:38%;

    transform:
        translate(-50%,-50%);

    animation:
        birdFloat
        3s
        ease-in-out
        infinite;

    z-index:3;
}

.bird{

    width:100%;
    height:100%;

    display:block;

    filter:
        drop-shadow(
            0 25px 45px #000b
        );
}


/* ================================
   МАХАНИЕ КРЫЛЬЯМИ
================================ */

.left-wing{

    transform-origin:
        220px 230px;

    animation:
        leftWing
        .72s
        ease-in-out
        infinite;
}

.right-wing{

    transform-origin:
        285px 245px;

    animation:
        rightWing
        .72s
        ease-in-out
        infinite;
}

@keyframes leftWing{

    0%,
    100%{
        transform:rotate(5deg);
    }

    50%{
        transform:rotate(-16deg);
    }
}

@keyframes rightWing{

    0%,
    100%{
        transform:rotate(-5deg);
    }

    50%{
        transform:rotate(16deg);
    }
}

@keyframes birdFloat{

    0%,
    100%{
        margin-top:10px;
    }

    50%{
        margin-top:-18px;
    }
}


/* ================================
   AVIA
================================ */

.splash-title{

    position:absolute;

    left:0;
    right:0;

    bottom:
        calc(
            105px +
            env(safe-area-inset-bottom)
        );

    width:100%;

    text-align:center;

    font-size:
        clamp(
            60px,
            19vw,
            90px
        );

    line-height:1;

    font-weight:900;

    letter-spacing:
        clamp(
            8px,
            3vw,
            16px
        );

    color:#fff;

    text-shadow:
        0 5px 35px #1675ed80;

    z-index:5;
}


/* ================================
   CATS DEVELOPER STUDIO
================================ */

.splash-studio{

    position:absolute;

    left:0;
    right:0;

    bottom:
        calc(
            67px +
            env(safe-area-inset-bottom)
        );

    text-align:center;

    color:#71839c;

    font-size:14px;

    letter-spacing:.5px;

    z-index:5;
}


/* ================================
   ПОЛОСКА ЗАГРУЗКИ
================================ */

.loading-area{

    position:absolute;

    left:10%;
    right:10%;

    bottom:
        calc(
            30px +
            env(safe-area-inset-bottom)
        );

    z-index:10;
}


/* фон полоски */

.loading-track{

    width:100%;

    height:6px;

    border-radius:20px;

    background:#172941;

    overflow:hidden;

    box-shadow:
        0 0 12px #0008;
}


/* голубая загрузка */

.loading-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #1685ff,
            #58c4ff
        );

    box-shadow:
        0 0 14px #1685ff;

    animation:
        loading
        5s
        linear
        forwards;
}

@keyframes loading{

    from{
        width:0%;
    }

    to{
        width:100%;
    }
}


/* ================================
   ОСНОВНОЙ ЭКРАН
================================ */

#app{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    min-height:100vh;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        calc(
            12px +
            env(safe-area-inset-top)
        )
        10px
        calc(
            12px +
            env(safe-area-inset-bottom)
        )
        10px;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 25%,
            #0c203b 0%,
            #040812 65%
        );

    transition:
        opacity .6s ease;

    z-index:5000;
}

#app.visible{

    opacity:1;

    pointer-events:auto;
}


/* ================================
   КАРТОЧКА
================================ */

.auth-card{

    position:relative;

    width:100%;
    height:100%;

    max-width:560px;
    max-height:850px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:
        30px
        22px
        30px;

    border-radius:30px;

    background:
        linear-gradient(
            180deg,
            #0d1b2ff7,
            #081323f7
        );

    border:1px solid #263852;

    box-shadow:
        0 30px 100px #000a,
        inset 0 1px 0 #ffffff08;

    overflow:hidden;

    animation:
        cardAppear
        .7s
        ease;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* ================================
   КРЕСТИК
================================ */

.skip{

    position:absolute;

    top:
        calc(
            14px +
            env(safe-area-inset-top)
        );

    right:14px;

    width:48px;
    height:48px;

    border:0;

    border-radius:50%;

    background:#17253a;

    color:#a6b4c6;

    font-size:29px;

    line-height:48px;

    text-align:center;

    touch-action:manipulation;
}

.skip:active{

    transform:scale(.9);
}


/* ================================
   ЛОГО
================================ */

.auth-logo{

    width:105px;
    height:105px;

    border-radius:29px;

    overflow:hidden;

    flex-shrink:0;

    box-shadow:
        0 20px 55px #1675ed50;
}

.auth-logo img{

    width:100%;
    height:100%;

    display:block;
}


/* ================================
   AVIA
================================ */

.auth-title{

    margin-top:22px;

    font-size:46px;

    line-height:1;

    font-weight:900;

    letter-spacing:6px;

    text-align:center;
}

.auth-subtitle{

    margin-top:14px;

    font-size:17px;

    line-height:1.5;

    text-align:center;

    color:#8c9db3;
}


/* ================================
   КНОПКИ
================================ */

.auth-buttons{

    width:100%;

    margin-top:38px;

    display:flex;

    flex-direction:column;

    gap:15px;
}

.auth-button{

    width:100%;

    height:68px;

    border-radius:18px;

    font-size:18px;

    font-weight:bold;

    touch-action:manipulation;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.auth-button:active{

    transform:scale(.975);

    opacity:.9;
}


/* ================================
   ВОЙТИ
================================ */

.login{

    border:0;

    background:#1675ed;

    color:#fff;

    box-shadow:
        0 14px 38px #1675ed45;
}


/* ================================
   РЕГИСТРАЦИЯ
================================ */

.register{

    background:#18263b;

    color:#edf5ff;

    border:1px solid #2c405c;
}


/* ================================
   НИЖНИЙ ТЕКСТ
================================ */

.auth-note{

    margin-top:25px;

    color:#596e88;

    font-size:12px;

    line-height:1.5;

    text-align:center;
}


/* ================================
   СООБЩЕНИЕ
================================ */

#message{

    position:fixed;

    left:12px;
    right:12px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:20000;

    display:none;

    padding:19px;

    border-radius:18px;

    background:#101e32;

    border:1px solid #2b405d;

    color:#b4c2d3;

    text-align:center;

    font-size:15px;

    box-shadow:
        0 15px 50px #0009;
}


/* ================================
   НИЗКИЙ ЭКРАН
================================ */

@media(max-height:700px){

    .bird-wrap{

        width:300px;
        height:300px;

        top:36%;
    }

    .splash-title{

        bottom:
            calc(
                82px +
                env(safe-area-inset-bottom)
            );

        font-size:58px;
    }

    .splash-studio{

        bottom:
            calc(
                48px +
                env(safe-area-inset-bottom)
            );

        font-size:12px;
    }

    .loading-area{

        bottom:
            calc(
                25px +
                env(safe-area-inset-bottom)
            );
    }

    .auth-card{

        padding:
            22px
            18px
            20px;
    }

    .auth-logo{

        width:78px;
        height:78px;
    }

    .auth-title{

        margin-top:15px;

        font-size:34px;
    }

    .auth-subtitle{

        margin-top:9px;

        font-size:14px;
    }

    .auth-buttons{

        margin-top:25px;

        gap:11px;
    }

    .auth-button{

        height:58px;

        font-size:17px;
    }

    .auth-note{

        margin-top:17px;
    }
}


/* ================================
   УЗКИЙ ТЕЛЕФОН
================================ */

@media(max-width:360px){

    .bird-wrap{

        width:285px;
        height:285px;
    }

    .auth-card{

        padding-left:15px;
        padding-right:15px;

        border-radius:25px;
    }

    .auth-title{

        font-size:32px;
    }

    .auth-button{

        height:57px;
    }
}

</style>
</head>


<body>


<!-- =================================
     ЗАГРУЗКА
================================= -->

<div id="splash">


    <div class="glow"></div>


    <!-- ПТИЦА -->

    <div class="bird-wrap">

        <svg
            class="bird"
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

                <linearGradient
                    id="body"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#ffffff"/>

                    <stop
                        offset=".65"
                        stop-color="#e8f5ff"/>

                    <stop
                        offset="1"
                        stop-color="#a8d8ff"/>

                </linearGradient>


                <linearGradient
                    id="wing"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#ffffff"/>

                    <stop
                        offset=".55"
                        stop-color="#d8edff"/>

                    <stop
                        offset="1"
                        stop-color="#75baff"/>

                </linearGradient>


                <linearGradient
                    id="blue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop
                        offset="0"
                        stop-color="#8bd5ff"/>

                    <stop
                        offset=".55"
                        stop-color="#4ca9ff"/>

                    <stop
                        offset="1"
                        stop-color="#1675ed"/>

                </linearGradient>

            </defs>


            <!-- НИЖНЕЕ КРЫЛО -->

            <path
                class="left-wing"
                d="
                M250 300
                C215 325 174 350 145 381
                C121 406 108 430 103 453
                C137 431 170 414 205 405
                C242 396 274 382 302 363Z"
                fill="url(#blue)"
            />


            <!-- ВЕРХНЕЕ КРЫЛО -->

            <path
                class="right-wing"
                d="
                M279 267
                C299 238 306 207 291 180
                C271 143 232 124 190 111
                C150 99 119 82 86 58
                C87 103 98 143 122 175
                C151 214 193 235 236 249
                C255 255 270 261 279 267Z"
                fill="url(#wing)"
            />


            <!-- СИНЯЯ ЧАСТЬ -->

            <path
                d="
                M89 183
                C126 201 165 213 208 225
                C248 236 276 251 286 272
                C272 293 246 307 216 311
                C175 306 136 288 109 262
                C92 245 80 216 89 183Z"
                fill="url(#blue)"
            />


            <!-- ТЕЛО -->

            <path
                d="
                M283 248
                C295 203 318 166 350 153
                C379 141 403 151 424 168
                C440 181 455 187 474 190
                C452 204 430 211 416 229
                C402 247 398 277 388 307
                C375 346 350 371 314 385
                C282 398 247 398 211 407
                C232 386 253 365 272 344
                C293 320 305 286 283 248Z"
                fill="url(#body)"
            />


            <!-- ГОЛОВА -->

            <path
                d="
                M347 153
                C369 141 393 149 414 166
                C432 180 452 187 474 190
                C452 202 431 207 414 220
                C402 199 383 186 360 182Z"
                fill="#f7fbff"
            />


            <!-- ГЛАЗ -->

            <circle
                cx="397"
                cy="183"
                r="12"
                fill="#07152d"
            />

            <circle
                cx="401"
                cy="179"
                r="3"
                fill="#fff"
            />

        </svg>

    </div>


    <!-- AVIA -->

    <div class="splash-title">
        AVIA
    </div>


    <!-- СТУДИЯ -->

    <div class="splash-studio">
        Cats Developer Studio
    </div>


    <!-- ПОЛОСКА ЗАГРУЗКИ -->

    <div class="loading-area">

        <div class="loading-track">

            <div class="loading-bar"></div>

        </div>

    </div>

</div>


<!-- =================================
     ОСНОВНОЙ ЭКРАН
================================= -->

<div id="app">


    <div class="auth-card">


        <!-- КРЕСТИК -->

        <button
            class="skip"
            id="skipButton">

            ×

        </button>


        <!-- ЛОГО -->

        <div class="auth-logo">

            <img
                src="./icon.svg"
                alt="AVIA">

        </div>


        <!-- НАЗВАНИЕ -->

        <div class="auth-title">
            AVIA
        </div>


        <div class="auth-subtitle">

            Войдите или зарегистрируйтесь,<br>
            чтобы продолжить

        </div>


        <!-- КНОПКИ -->

        <div class="auth-buttons">


            <button
                class="auth-button login"
                id="loginButton">

                Войти

            </button>


            <button
                class="auth-button register"
                id="registerButton">

                Зарегистрироваться

            </button>


        </div>


        <div class="auth-note">

            Ваш аккаунт позволит сохранять<br>
            историю общения с AVIA

        </div>


    </div>

</div>


<!-- =================================
     СООБЩЕНИЕ
================================= -->

<div id="message">
    Этот раздел ещё не готов
</div>


<script>

/* =================================
   ЗАГРУЗКА 5 СЕКУНД
================================= */

const splash =
    document.getElementById("splash");

const app =
    document.getElementById("app");


setTimeout(function(){

    splash.style.opacity = "0";


    setTimeout(function(){

        splash.style.display = "none";

        app.classList.add("visible");

    },600);

},5000);


/* =================================
   СООБЩЕНИЯ
================================= */

const message =
    document.getElementById("message");

let messageTimer = null;


function showMessage(text){

    clearTimeout(messageTimer);

    message.textContent = text;

    message.style.display = "block";


    messageTimer =
        setTimeout(function(){

            message.style.display = "none";

        },3000);
}


/* =================================
   КРЕСТИК
================================= */

document
    .getElementById("skipButton")
    .addEventListener(
        "click",
        function(){

            app.style.opacity = "0";


            setTimeout(function(){

                app.style.display = "none";

                showMessage(
                    "Этот раздел ещё не готов"
                );

            },300);

        }
    );


/* =================================
   ВОЙТИ
================================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        function(){

            showMessage(
                "Раздел входа ещё не готов"
            );

        }
    );


/* =================================
   РЕГИСТРАЦИЯ
================================= */

document
    .getElementById("registerButton")
    .addEventListener(
        "click",
        function(){

            showMessage(
                "Регистрация ещё не готова"
            );

        }
    );


/* =================================
   SERVICE WORKER
================================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator
                .serviceWorker
                .register("./sw.js")
                .catch(function(error){

                    console.error(
                        "Service Worker:",
                        error
                    );

                });

        }
    );

}

</script>

</body>
</html>
