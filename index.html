<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>AVIA</title>

<meta name="theme-color" content="#040812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:#040812;
    touch-action:none;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

/* =========================================
   SPLASH
========================================= */

#splash{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    min-height:100vh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 42%,
            #102b50 0%,
            #071326 32%,
            #040812 72%
        );

    z-index:9999;

    transition:opacity .6s ease;
}

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.6;

    animation:
        twinkle
        2.4s
        ease-in-out
        infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

.glow{
    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    background:#1675ed;

    filter:blur(90px);

    opacity:.17;

    animation:
        glowAnimation
        3s
        ease-in-out
        infinite;
}

@keyframes glowAnimation{
    0%,100%{
        transform:scale(.9);
        opacity:.12;
    }

    50%{
        transform:scale(1.15);
        opacity:.25;
    }
}

/* =========================================
   ПТИЦА
========================================= */

.bird-wrap{
    position:absolute;

    width:min(68vw,290px);
    height:min(68vw,290px);

    left:50%;
    top:42%;

    transform:translate(-50%,-50%);

    animation:
        birdFloat
        3s
        ease-in-out
        infinite;

    z-index:2;
}

.bird{
    width:100%;
    height:100%;
    display:block;

    filter:
        drop-shadow(
            0 20px 40px #0009
        );
}

/* крылья */

.left-wing{
    transform-origin:220px 230px;

    animation:
        leftWing
        .75s
        ease-in-out
        infinite;
}

.right-wing{
    transform-origin:285px 245px;

    animation:
        rightWing
        .75s
        ease-in-out
        infinite;
}

@keyframes leftWing{
    0%,100%{
        transform:rotate(5deg);
    }

    50%{
        transform:rotate(-14deg);
    }
}

@keyframes rightWing{
    0%,100%{
        transform:rotate(-5deg);
    }

    50%{
        transform:rotate(14deg);
    }
}

@keyframes birdFloat{
    0%,100%{
        margin-top:8px;
    }

    50%{
        margin-top:-15px;
    }
}

/* =========================================
   НАЗВАНИЕ
========================================= */

.splash-title{
    position:absolute;

    left:0;
    right:0;

    bottom:
        calc(
            92px +
            env(safe-area-inset-bottom)
        );

    width:100%;

    text-align:center;

    font-size:
        clamp(
            56px,
            18vw,
            86px
        );

    line-height:1;

    font-weight:900;

    letter-spacing:
        clamp(
            8px,
            3vw,
            15px
        );

    color:#fff;

    text-shadow:
        0 5px 35px #1675ed70;

    z-index:5;

    animation:
        titleAppear
        1.4s
        ease;
}

.splash-studio{
    position:absolute;

    left:0;
    right:0;

    bottom:
        calc(
            48px +
            env(safe-area-inset-bottom)
        );

    width:100%;

    text-align:center;

    color:#71839c;

    font-size:14px;

    z-index:5;

    animation:
        titleAppear
        1.8s
        ease;
}

@keyframes titleAppear{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================
   ОСНОВНОЙ ЭКРАН
========================================= */

#app{
    position:fixed;

    inset:0;

    width:100%;
    height:100dvh;
    min-height:100vh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        calc(
            16px +
            env(safe-area-inset-top)
        )
        12px
        calc(
            16px +
            env(safe-area-inset-bottom)
        )
        12px;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 25%,
            #0c203b 0%,
            #040812 60%
        );

    transition:opacity .6s ease;

    z-index:5000;
}

#app.visible{
    opacity:1;
    pointer-events:auto;
}

/* =========================================
   КАРТОЧКА — ПОЧТИ ВЕСЬ ЭКРАН
========================================= */

.auth-card{
    position:relative;

    width:100%;
    height:100%;

    max-width:520px;
    max-height:760px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:
        35px
        22px
        30px;

    border-radius:30px;

    background:
        linear-gradient(
            180deg,
            #0d1b2fF7,
            #081323F7
        );

    border:1px solid #263852;

    box-shadow:
        0 30px 100px #000a,
        inset 0 1px 0 #ffffff08;

    animation:
        cardAppear
        .7s
        ease;

    overflow:hidden;
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================================
   КРЕСТИК
========================================= */

.skip{
    position:absolute;

    top:
        calc(
            15px +
            env(safe-area-inset-top)
        );

    right:15px;

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:#17253a;

    color:#9cacc0;

    font-size:26px;
    line-height:44px;

    text-align:center;

    cursor:pointer;

    z-index:10;

    touch-action:manipulation;
}

.skip:active{
    transform:scale(.9);
}

/* =========================================
   ЛОГО
========================================= */

.auth-logo{
    width:96px;
    height:96px;

    border-radius:27px;

    overflow:hidden;

    flex-shrink:0;

    box-shadow:
        0 18px 50px #1675ed45;
}

.auth-logo img{
    width:100%;
    height:100%;
    display:block;
}

/* =========================================
   AVIA
========================================= */

.auth-title{
    margin-top:22px;

    font-size:42px;

    line-height:1;

    font-weight:900;

    letter-spacing:5px;

    text-align:center;
}

.auth-subtitle{
    margin-top:13px;

    font-size:16px;

    line-height:1.5;

    text-align:center;

    color:#8a9bb1;
}

/* =========================================
   КНОПКИ
========================================= */

.auth-buttons{
    width:100%;

    margin-top:35px;

    display:flex;
    flex-direction:column;

    gap:14px;
}

.auth-button{
    width:100%;

    height:62px;

    border-radius:17px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    touch-action:manipulation;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.auth-button:active{
    transform:scale(.98);
    opacity:.9;
}

.login{
    border:0;

    background:#1675ed;

    color:#fff;

    box-shadow:
        0 12px 35px #1675ed45;
}

.register{
    background:#18263b;

    color:#edf5ff;

    border:1px solid #2c405c;
}

/* =========================================
   НИЖНИЙ ТЕКСТ
========================================= */

.auth-note{
    margin-top:25px;

    color:#596e88;

    font-size:12px;

    line-height:1.5;

    text-align:center;
}

/* =========================================
   СООБЩЕНИЕ
========================================= */

#message{
    position:fixed;

    left:14px;
    right:14px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:20000;

    display:none;

    padding:18px;

    border-radius:18px;

    background:#101e32;

    border:1px solid #2b405d;

    color:#b4c2d3;

    text-align:center;

    font-size:14px;

    box-shadow:
        0 15px 50px #0009;

    animation:
        messageAppear
        .35s
        ease;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================
   НЕВЫСОКИЕ ТЕЛЕФОНЫ
========================================= */

@media(max-height:700px){

    .bird-wrap{
        width:205px;
        height:205px;

        top:38%;
    }

    .splash-title{
        bottom:
            calc(
                70px +
                env(safe-area-inset-bottom)
            );

        font-size:54px;
    }

    .splash-studio{
        bottom:
            calc(
                32px +
                env(safe-area-inset-bottom)
            );

        font-size:12px;
    }

    .auth-card{
        padding:
            25px
            18px
            22px;
    }

    .auth-logo{
        width:72px;
        height:72px;
    }

    .auth-title{
        margin-top:15px;
        font-size:31px;
    }

    .auth-subtitle{
        margin-top:8px;
        font-size:13px;
    }

    .auth-buttons{
        margin-top:22px;
        gap:10px;
    }

    .auth-button{
        height:52px;
        font-size:16px;
    }

    .auth-note{
        margin-top:15px;
    }
}

/* =========================================
   ОЧЕНЬ УЗКИЙ ТЕЛЕФОН
========================================= */

@media(max-width:360px){

    #app{
        padding-left:8px;
        padding-right:8px;
    }

    .auth-card{
        border-radius:25px;
        padding-left:15px;
        padding-right:15px;
    }

    .auth-title{
        font-size:30px;
    }

    .auth-button{
        height:54px;
    }
}

</style>
</head>

<body>


<!-- =====================================
     ЗАСТАВКА
===================================== -->

<div id="splash">

    <div class="stars">

        <span class="star" style="left:6%;top:13%;animation-delay:.2s"></span>
        <span class="star" style="left:17%;top:29%;animation-delay:1s"></span>
        <span class="star" style="left:29%;top:11%;animation-delay:.5s"></span>
        <span class="star" style="left:42%;top:21%;animation-delay:1.3s"></span>
        <span class="star" style="left:55%;top:9%;animation-delay:.7s"></span>
        <span class="star" style="left:68%;top:27%;animation-delay:1.5s"></span>
        <span class="star" style="left:81%;top:15%;animation-delay:.4s"></span>
        <span class="star" style="left:93%;top:34%;animation-delay:1.1s"></span>

        <span class="star" style="left:9%;top:54%;animation-delay:1.7s"></span>
        <span class="star" style="left:21%;top:71%;animation-delay:.8s"></span>
        <span class="star" style="left:36%;top:58%;animation-delay:1.2s"></span>
        <span class="star" style="left:51%;top:68%;animation-delay:.3s"></span>
        <span class="star" style="left:65%;top:56%;animation-delay:1.8s"></span>
        <span class="star" style="left:79%;top:72%;animation-delay:.9s"></span>
        <span class="star" style="left:91%;top:60%;animation-delay:1.4s"></span>

        <span class="star" style="left:4%;top:43%;animation-delay:.6s"></span>
        <span class="star" style="left:96%;top:49%;animation-delay:1.6s"></span>

    </div>


    <div class="glow"></div>


    <!-- ПТИЦА -->

    <div class="bird-wrap">

        <svg
            class="bird"
            viewBox="0 0 512 512"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

                <linearGradient
                    id="body"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset=".65" stop-color="#e8f5ff"/>
                    <stop offset="1" stop-color="#a8d8ff"/>

                </linearGradient>


                <linearGradient
                    id="wing"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset=".55" stop-color="#d8edff"/>
                    <stop offset="1" stop-color="#75baff"/>

                </linearGradient>


                <linearGradient
                    id="blue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

                    <stop offset="0" stop-color="#8bd5ff"/>
                    <stop offset=".55" stop-color="#4ca9ff"/>
                    <stop offset="1" stop-color="#1675ed"/>

                </linearGradient>

            </defs>


            <!-- Нижнее крыло -->

            <path
                class="left-wing"
                d="
                M250 300
                C215 325 174 350 145 381
                C121 406 108 430 103 453
                C137 431 170 414 205 405
                C242 396 274 382 302 363Z"
                fill="url(#blue)"
            />


            <!-- Верхнее крыло -->

            <path
                class="right-wing"
                d="
                M279 267
                C299 238 306 207 291 180
                C271 143 232 124 190 111
                C150 99 119 82 86 58
                C87 103 98 143 122 175
                C151 214 193 235 236 249
                C255 255 270 261 279 267Z"
                fill="url(#wing)"
            />


            <path
                d="
                M89 183
                C126 201 165 213 208 225
                C248 236 276 251 286 272
                C272 293 246 307 216 311
                C175 306 136 288 109 262
                C92 245 80 216 89 183Z"
                fill="url(#blue)"
            />


            <!-- Тело -->

            <path
                d="
                M283 248
                C295 203 318 166 350 153
                C379 141 403 151 424 168
                C440 181 455 187 474 190
                C452 204 430 211 416 229
                C402 247 398 277 388 307
                C375 346 350 371 314 385
                C282 398 247 398 211 407
                C232 386 253 365 272 344
                C293 320 305 286 283 248Z"
                fill="url(#body)"
            />


            <path
                d="
                M347 153
                C369 141 393 149 414 166
                C432 180 452 187 474 190
                C452 202 431 207 414 220
                C402 199 383 186 360 182Z"
                fill="#f7fbff"
            />


            <!-- Глаз -->

            <circle
                cx="397"
                cy="183"
                r="12"
                fill="#07152d"
            />

            <circle
                cx="401"
                cy="179"
                r="3"
                fill="#fff"
            />

        </svg>

    </div>


    <div class="splash-title">
        AVIA
    </div>


    <div class="splash-studio">
        Cats Developer Studio
    </div>

</div>


<!-- =====================================
     ОСНОВНОЙ ЭКРАН
===================================== -->

<div id="app">

    <div class="auth-card">


        <button
            class="skip"
            id="skipButton">
            ×
        </button>


        <div class="auth-logo">

            <img
                src="./icon.svg"
                alt="AVIA">

        </div>


        <div class="auth-title">
            AVIA
        </div>


        <div class="auth-subtitle">

            Войдите или зарегистрируйтесь,<br>
            чтобы продолжить

        </div>


        <div class="auth-buttons">

            <button
                class="auth-button login"
                id="loginButton">

                Войти

            </button>


            <button
                class="auth-button register"
                id="registerButton">

                Зарегистрироваться

            </button>

        </div>


        <div class="auth-note">

            Ваш аккаунт позволит сохранять<br>
            историю общения с AVIA

        </div>

    </div>

</div>


<!-- =====================================
     СООБЩЕНИЕ
===================================== -->

<div id="message">
    Этот раздел ещё не готов
</div>


<script>

/* =========================================
   ЗАПУСК
========================================= */

const splash =
    document.getElementById("splash");

const app =
    document.getElementById("app");


setTimeout(function(){

    splash.style.opacity = "0";

    setTimeout(function(){

        splash.style.display = "none";

        app.classList.add("visible");

    },600);

},5000);


/* =========================================
   СООБЩЕНИЯ
========================================= */

const message =
    document.getElementById("message");

let messageTimer = null;


function showMessage(text){

    clearTimeout(messageTimer);

    message.textContent = text;

    message.style.display = "block";

    messageTimer = setTimeout(function(){

        message.style.display = "none";

    },3000);
}


/* =========================================
   ПРОПУСТИТЬ
========================================= */

document
    .getElementById("skipButton")
    .addEventListener("click",function(){

        app.style.opacity = "0";

        setTimeout(function(){

            app.style.display = "none";

            showMessage(
                "Этот раздел ещё не готов"
            );

        },300);

    });


/* =========================================
   ВОЙТИ
========================================= */

document
    .getElementById("loginButton")
    .addEventListener("click",function(){

        showMessage(
            "Раздел входа ещё не готов"
        );

    });


/* =========================================
   РЕГИСТРАЦИЯ
========================================= */

document
    .getElementById("registerButton")
    .addEventListener("click",function(){

        showMessage(
            "Регистрация ещё не готова"
        );

    });


/* =========================================
   SERVICE WORKER
========================================= */

if("serviceWorker" in navigator){

    window.addEventListener("load",function(){

        navigator
            .serviceWorker
            .register("./sw.js")
            .catch(function(error){

                console.error(
                    "Service Worker:",
                    error
                );

            });

    });

}


/* =========================================
   ЗАПРЕТ ЖЕСТА СДВИГА
========================================= */

document.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();

    },
    {
        passive:false
    }
);

</script>

</body>
</html>
