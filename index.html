<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVIA</title>

<meta name="theme-color" content="#06101f">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#040812;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* КНОПКА ВСЕГДА СВЕРХУ */
#installBanner{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:999999;

    display:flex;
    align-items:center;
    gap:12px;

    padding:12px;
    border-radius:18px;

    background:#101d31;
    border:1px solid #263852;
    box-shadow:0 15px 45px #0008;
}

#installIcon{
    width:52px;
    height:52px;
    border-radius:14px;
}

.info{
    flex:1;
}

.title{
    font-size:16px;
    font-weight:bold;
}

.text{
    margin-top:4px;
    color:#8293ab;
    font-size:12px;
}

button{
    border:0;
    border-radius:12px;
    background:#1675ed;
    color:#fff;
    font-weight:bold;
}

#installButton{
    padding:11px 14px;
}

#closeButton{
    background:none;
    color:#8293ab;
    font-size:22px;
}

main{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.app{
    width:100%;
    max-width:430px;
    text-align:center;
}

.logo{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:26px;
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
}

h1{
    margin:24px 0 0;
    font-size:48px;
    letter-spacing:4px;
}

.sub{
    margin-top:10px;
    color:#9aa9bd;
}

.studio{
    margin-top:8px;
    color:#526986;
    font-size:13px;
}

#bigInstall{
    width:100%;
    margin-top:30px;
    padding:17px;
    font-size:17px;
}

#status{
    margin-top:14px;
    color:#687a93;
    font-size:13px;
}
</style>
</head>

<body>

<!-- ЭТА ПАНЕЛЬ ВСЕГДА ЕСТЬ -->
<div id="installBanner">

    <img id="installIcon" src="./icon.svg">

    <div class="info">
        <div class="title">Установить AVIA</div>
        <div class="text">Установить приложение на устройство</div>
    </div>

    <button id="installButton">
        Установить
    </button>

    <button id="closeButton">
        ×
    </button>

</div>

<main>
<div class="app">

    <div class="logo">
        <img src="./icon.svg" alt="AVIA">
    </div>

    <h1>AVIA</h1>

    <div class="sub">
        Умная нейросеть
    </div>

    <div class="studio">
        Cats Developer Studio
    </div>

    <button id="bigInstall">
        Установить AVIA
    </button>

    <div id="status"></div>

</div>
</main>

<script>

let deferredPrompt = null;

const banner = document.getElementById("installBanner");
const installButton = document.getElementById("installButton");
const bigInstall = document.getElementById("bigInstall");
const closeButton = document.getElementById("closeButton");
const status = document.getElementById("status");


/* Chrome подготовил настоящую установку */
window.addEventListener("beforeinstallprompt", event => {

    event.preventDefault();

    deferredPrompt = event;

    banner.style.display = "flex";
});


/* Установить */
async function installAVIA(){

    if(deferredPrompt){

        deferredPrompt.prompt();

        const result =
            await deferredPrompt.userChoice;

        if(result.outcome === "accepted"){
            status.textContent = "AVIA устанавливается...";
        }

        deferredPrompt = null;

        return;
    }

    /*
      Chrome пока не дал системный prompt.
      Кнопка остаётся сверху.
    */
    status.textContent =
        "Открой меню Chrome ⋮ → «Установить приложение».";
}


installButton.onclick = installAVIA;
bigInstall.onclick = installAVIA;


/* Закрыть */
closeButton.onclick = () => {
    banner.style.display = "none";
};


/* Установлено */
window.addEventListener("appinstalled", () => {

    banner.style.display = "none";

    bigInstall.style.display = "none";

    status.textContent = "AVIA установлена.";

});


/* Service Worker */
if("serviceWorker" in navigator){

    navigator.serviceWorker.register("./sw.js")
        .catch(error => console.error(error));

}

</script>

</body>
</html>
