<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#050b18">

<title>AVIA</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030711;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: white;
}

/* =========================
   SPLASH
========================= */

#splash {
    position: fixed;
    inset: 0;
    z-index: 9999;

    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(24, 111, 255, 0.18),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #030711 0%,
            #061124 55%,
            #030711 100%
        );

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

#splash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* мягкое свечение */

.glow {
    position: absolute;

    width: 260px;
    height: 260px;

    left: 50%;
    top: 43%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(31, 132, 255, 0.12);

    filter: blur(50px);

    animation: glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse {
    0% {
        opacity: .35;
        transform: translate(-50%, -50%) scale(.85);
    }

    50% {
        opacity: .8;
        transform: translate(-50%, -50%) scale(1.15);
    }

    100% {
        opacity: .35;
        transform: translate(-50%, -50%) scale(.85);
    }
}

/* =========================
   FLIGHT AREA
========================= */

.flight {
    position: relative;

    width: 100%;
    height: 330px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* след птицы */

.flight::before {
    content: "";

    position: absolute;

    width: 220px;
    height: 90px;

    left: 50%;
    top: 50%;

    transform:
        translate(-75%, -50%)
        rotate(-8deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(49, 160, 255, .03),
            rgba(49, 160, 255, .16),
            transparent
        );

    filter: blur(18px);

    opacity: 0;

    animation: trail 2.7s ease-in-out infinite;
}

@keyframes trail {
    0% {
        opacity: 0;
        transform:
            translate(-140%, -50%)
            rotate(-8deg)
            scaleX(.4);
    }

    35% {
        opacity: .8;
    }

    70% {
        opacity: .25;
    }

    100% {
        opacity: 0;
        transform:
            translate(-20%, -50%)
            rotate(-8deg)
            scaleX(1.5);
    }
}

/* =========================
   BIRD
========================= */

.bird {
    position: relative;

    width: 260px;
    height: 210px;

    animation:
        birdFlight 2.8s cubic-bezier(.45,.05,.55,.95) infinite,
        birdFloat 1.8s ease-in-out infinite;
}

@keyframes birdFlight {

    0% {
        transform:
            translateX(-45px)
            translateY(12px)
            rotate(-7deg)
            scale(.88);
        opacity: 0;
    }

    12% {
        opacity: 1;
    }

    35% {
        transform:
            translateX(10px)
            translateY(-10px)
            rotate(2deg)
            scale(1);
    }

    55% {
        transform:
            translateX(28px)
            translateY(4px)
            rotate(5deg)
            scale(1.02);
    }

    75% {
        transform:
            translateX(-2px)
            translateY(-8px)
            rotate(-1deg)
            scale(1);
    }

    100% {
        transform:
            translateX(55px)
            translateY(-18px)
            rotate(7deg)
            scale(.94);
        opacity: 0;
    }
}

@keyframes birdFloat {

    0%,
    100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }
}

/* тело птицы */

.bird-body {
    position: absolute;

    width: 145px;
    height: 105px;

    right: 22px;
    top: 58px;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #eaf7ff 48%,
            #a9d9ff 100%
        );

    border-radius:
        65% 75% 58% 45% /
        65% 65% 48% 48%;

    transform: rotate(-7deg);

    box-shadow:
        0 0 12px rgba(255,255,255,.3),
        0 0 35px rgba(63,163,255,.28);
}

/* клюв */

.beak {
    position: absolute;

    right: -30px;
    top: 65px;

    width: 42px;
    height: 25px;

    background:
        linear-gradient(
            135deg,
            #9bdcff,
            #1675ed
        );

    clip-path: polygon(
        0 0,
        100% 50%,
        0 100%
    );

    transform: rotate(-5deg);
}

/* глаз */

.eye {
    position: absolute;

    width: 13px;
    height: 13px;

    right: 62px;
    top: 35px;

    background: #061124;

    border-radius: 50%;

    box-shadow:
        0 0 8px rgba(80,180,255,.5);
}

.eye::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 4px;

    top: 2px;
    left: 3px;

    border-radius: 50%;

    background: white;
}

/* верхнее крыло */

.wing-top {
    position: absolute;

    width: 130px;
    height: 125px;

    left: 45px;
    top: 15px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d7edff 55%,
            #70b9ff
        );

    clip-path: polygon(
        0 0,
        78% 28%,
        100% 80%,
        55% 100%,
        18% 70%
    );

    transform-origin: 80% 90%;

    animation: wingFlap 0.75s ease-in-out infinite;
}

@keyframes wingFlap {

    0%,
    100% {
        transform: rotate(8deg);
    }

    50% {
        transform: rotate(-24deg);
    }
}

/* нижнее синее крыло */

.wing-bottom {
    position: absolute;

    width: 125px;
    height: 90px;

    left: 28px;
    top: 92px;

    background:
        linear-gradient(
            135deg,
            #8bd5ff,
            #3da5ff 55%,
            #146fe8
        );

    clip-path: polygon(
        0 10%,
        90% 30%,
        55% 100%,
        20% 72%
    );

    transform-origin: 85% 20%;

    animation: wingBottom 0.75s ease-in-out infinite;
}

@keyframes wingBottom {

    0%,
    100% {
        transform: rotate(3deg);
    }

    50% {
        transform: rotate(18deg);
    }
}

/* хвост */

.tail {
    position: absolute;

    width: 105px;
    height: 75px;

    left: 5px;
    top: 120px;

    background:
        linear-gradient(
            135deg,
            #8bd5ff,
            #1978ec
        );

    clip-path: polygon(
        100% 0,
        40% 40%,
        0 100%,
        20% 42%
    );

    transform: rotate(-7deg);
}

/* =========================
   SPEED LINES
========================= */

.speed {
    position: absolute;

    width: 100px;
    height: 3px;

    left: calc(50% - 145px);
    top: 50%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(75,181,255,.75),
            transparent
        );

    filter: blur(.3px);

    animation: speedMove 1.1s linear infinite;
}

.speed:nth-child(2) {
    width: 65px;
    margin-top: 35px;
    animation-delay: .3s;
}

.speed:nth-child(3) {
    width: 80px;
    margin-top: -45px;
    animation-delay: .55s;
}

@keyframes speedMove {

    0% {
        opacity: 0;
        transform: translateX(0);
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateX(-100px);
    }
}

/* =========================
   TEXT
========================= */

.brand {
    position: relative;

    text-align: center;

    margin-top: -5px;
}

.brand h1 {
    margin: 0;

    font-size: 42px;
    font-weight: 800;

    letter-spacing: 8px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #9fd8ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 0 25px rgba(59,155,255,.25);

    animation: brandAppear 1.2s ease both;
}

.brand p {
    margin: 8px 0 0;

    color: rgba(190,220,255,.72);

    font-size: 13px;

    letter-spacing: 2px;

    animation: brandAppear 1.5s ease both;
}

@keyframes brandAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   LOADING
========================= */

.loading {
    position: absolute;

    left: 50%;
    bottom: 75px;

    transform: translateX(-50%);

    width: min(280px, 72vw);

    text-align: center;
}

.loading-text {
    display: flex;
    justify-content: space-between;

    margin-bottom: 9px;

    color: rgba(190,220,255,.65);

    font-size: 11px;

    letter-spacing: 1.5px;
}

.percent {
    color: #73c5ff;
}

.bar {
    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 20px;

    background: rgba(255,255,255,.09);

    box-shadow:
        inset 0 0 8px rgba(0,0,0,.4);
}

.bar-fill {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #1675ed,
            #4cb7ff,
            #9bdcff
        );

    box-shadow:
        0 0 14px rgba(62,171,255,.9);

    transition: width .08s linear;
}

/* =========================
   STUDIO
========================= */

.studio {
    position: absolute;

    bottom: 25px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 10px;

    letter-spacing: 2px;

    color: rgba(150,190,230,.4);
}

/* =========================
   APP
========================= */

#app {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    background: #050a14;

    opacity: 0;

    transition: opacity .7s ease;
}

#app.show {
    opacity: 1;
}

/* =========================
   DEMO CHAT
========================= */

.chat {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.header {
    height: 70px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid rgba(255,255,255,.06);

    background: rgba(5,10,20,.92);

    backdrop-filter: blur(20px);
}

.logo {
    width: 42px;
    height: 42px;

    margin-right: 12px;

    border-radius: 13px;

    background: #07152d;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    box-shadow:
        0 5px 25px rgba(0,100,255,.15);
}

.logo-bird {
    width: 32px;
    height: 28px;

    position: relative;
}

.logo-bird::before {
    content: "";

    position: absolute;

    width: 26px;
    height: 19px;

    right: 0;
    top: 7px;

    border-radius: 60%;

    background:
        linear-gradient(
            135deg,
            white,
            #9ed9ff
        );
}

.logo-bird::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 18px;

    left: 0;
    top: 1px;

    background:
        linear-gradient(
            135deg,
            white,
            #4ca9ff
        );

    clip-path: polygon(
        0 0,
        100% 35%,
        65% 100%,
        25% 70%
    );
}

.header-title {
    font-weight: 700;
    font-size: 17px;
}

.header-sub {
    margin-top: 2px;

    font-size: 10px;

    color: rgba(190,210,240,.45);

    letter-spacing: .8px;
}

.main {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    text-align: center;
}

.main h2 {
    margin: 0 0 10px;

    font-size: 26px;
}

.main p {
    margin: 0;

    color: rgba(210,220,235,.55);

    line-height: 1.5;
}
</style>
</head>

<body>

<!-- =========================
     SPLASH SCREEN
========================= -->

<div id="splash">

    <div class="glow"></div>

    <div class="flight">

        <div class="speed"></div>
        <div class="speed"></div>
        <div class="speed"></div>

        <div class="bird">

            <div class="tail"></div>

            <div class="wing-top"></div>

            <div class="wing-bottom"></div>

            <div class="bird-body"></div>

            <div class="eye"></div>

            <div class="beak"></div>

        </div>

    </div>

    <div class="brand">

        <h1>AVIA</h1>

        <p>CATS DEVELOPER STUDIO</p>

    </div>

    <div class="loading">

        <div class="loading-text">
            <span id="loadingStatus">Запуск AVIA</span>
            <span class="percent">
                <span id="percent">0</span>%
            </span>
        </div>

        <div class="bar">
            <div
                id="barFill"
                class="bar-fill">
            </div>
        </div>

    </div>

    <div class="studio">
        POWERED BY CATS DEVELOPER STUDIO
    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

    <div class="chat">

        <div class="header">

            <div class="logo">
                <div class="logo-bird"></div>
            </div>

            <div>
                <div class="header-title">
                    AVIA
                </div>

                <div class="header-sub">
                    Cats Developer Studio
                </div>
            </div>

        </div>

        <div class="main">

            <div>

                <h2>
                    Добро пожаловать в AVIA
                </h2>

                <p>
                    Твоя нейросеть готова к работе.
                </p>

            </div>

        </div>

    </div>

</div>


<script>
/* =========================
   LOADING
========================= */

const splash = document.getElementById("splash");
const app = document.getElementById("app");

const percent = document.getElementById("percent");
const barFill = document.getElementById("barFill");
const loadingStatus = document.getElementById("loadingStatus");

let progress = 0;

const statuses = [
    [0, "Запуск AVIA"],
    [20, "Подготовка интерфейса"],
    [40, "Загрузка системы"],
    [60, "Подключение модулей"],
    [80, "Почти готово"],
    [95, "AVIA запускается"],
    [100, "Готово"]
];

function updateStatus(value) {

    let current = statuses[0][1];

    for (const item of statuses) {

        if (value >= item[0]) {
            current = item[1];
        }

    }

    loadingStatus.textContent = current;
}

const loadingTimer = setInterval(() => {

    progress += Math.random() * 2.8;

    if (progress >= 100) {

        progress = 100;

        clearInterval(loadingTimer);

        percent.textContent = "100";
        barFill.style.width = "100%";

        updateStatus(100);

        setTimeout(() => {

            splash.classList.add("hide");
            app.classList.add("show");

        }, 700);

        return;
    }

    percent.textContent = Math.floor(progress);
    barFill.style.width = progress + "%";

    updateStatus(progress);

}, 80);
</script>

</body>
</html>
