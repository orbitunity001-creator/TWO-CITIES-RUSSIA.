<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111522"/>
    <stop offset="0.55" stop-color="#080a12"/>
    <stop offset="1" stop-color="#020204"/>
  </linearGradient>

  <linearGradient id="redCar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff4b4b"/>
    <stop offset="0.25" stop-color="#d7192d"/>
    <stop offset="0.65" stop-color="#a70719"/>
    <stop offset="1" stop-color="#4d030b"/>
  </linearGradient>

  <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff5b5b"/>
    <stop offset="0.5" stop-color="#d7192d"/>
    <stop offset="1" stop-color="#850613"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9bdfff"/>
    <stop offset="0.35" stop-color="#244c70"/>
    <stop offset="0.75" stop-color="#0a1728"/>
    <stop offset="1" stop-color="#02050b"/>
  </linearGradient>

  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#161820"/>
    <stop offset="1" stop-color="#020203"/>
  </linearGradient>

  <radialGradient id="headlight">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.35" stop-color="#d9f5ff"/>
    <stop offset="1" stop-color="#5ccaff"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <clipPath id="rounded">
    <rect width="512" height="512" rx="92"/>
  </clipPath>

</defs>


<!-- BACKGROUND -->

<rect width="512"
      height="512"
      rx="92"
      fill="url(#background)"/>

<g clip-path="url(#rounded)">

