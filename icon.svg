<stop offset="1" stop-color="#760719"/>
</linearGradient>

<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#32677f"/>
<stop offset=".5" stop-color="#0c202b"/>
<stop offset="1" stop-color="#020609"/>
</linearGradient>

<filter id="shadow">
