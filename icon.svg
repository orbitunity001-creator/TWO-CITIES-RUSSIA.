<svg
    xmlns="http://www.w3.org/2000/svg"
    width="512"
    height="512"
    viewBox="0 0 512 512">

    <defs>

        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#02040b"/>

            <stop
                offset="50%"
                stop-color="#101b35"/>

            <stop
                offset="100%"
                stop-color="#280b45"/>

        </linearGradient>


        <linearGradient
            id="neon"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#43e7ff"/>

            <stop
                offset="50%"
                stop-color="#ffffff"/>

            <stop
                offset="100%"
                stop-color="#a86cff"/>

        </linearGradient>


        <filter
            id="glow">

            <feGaussianBlur
                stdDeviation="9"
                result="blur"/>

            <feMerge>

                <feMergeNode
                    in="blur"/>

                <feMergeNode
                    in="SourceGraphic"/>

            </feMerge>

        </filter>


        <filter
            id="smallGlow">

            <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

            <feMerge>

                <feMergeNode
                    in="blur"/>

                <feMergeNode
                    in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>


    <!-- ФОН -->

    <rect
        width="512"
        height="512"
        rx="110"
        fill="url(#background)"/>


    <!-- СВЕЧЕНИЕ -->

    <circle
        cx="256"
        cy="210"
        r="190"
        fill="#248cff"
        opacity=".08"/>

    <circle
        cx="256"
        cy="210"
        r="120"
        fill="#a84dff"
        opacity=".08"/>


    <!-- ЗВЁЗДЫ -->

    <g
        fill="white"
        opacity=".7">

        <circle
            cx="70"
            cy="80"
            r="2"/>

        <circle
            cx="125"
            cy="55"
            r="2"/>

        <circle
            cx="205"
            cy="82"
            r="2"/>

        <circle
            cx="315"
            cy="58"
            r="2"/>

        <circle
            cx="420"
            cy="92"
            r="2"/>

        <circle
            cx="460"
            cy="155"
            r="2"/>

        <circle
            cx="55"
            cy="180"
            r="2"/>

    </g>


    <!-- ГОРОД -->

    <g
        fill="#060a15">

        <rect
            x="30"
            y="290"
            width="55"
            height="222"/>

        <rect
            x="82"
            y="250"
            width="65"
            height="262"/>

        <rect
            x="150"
            y="310"
            width="55"
            height="202"/>

        <rect
            x="210"
            y="225"
            width="70"
            height="287"/>

        <rect
            x="285"
            y="275"
            width="60"
            height="237"/>

        <rect
            x="350"
            y="235"
            width="65"
            height="277"/>

        <rect
            x="420"
            y="295"
            width="60"
            height="217"/>

    </g>


    <!-- ОКНА -->

    <g
        fill="#48ddff"
        opacity=".55"
        filter="url(#smallGlow)">

        <rect
            x="45"
            y="315"
            width="11"
            height="4"/>

        <rect
            x="68"
            y="350"
            width="11"
            height="4"/>

        <rect
            x="100"
            y="275"
            width="11"
            height="4"/>

        <rect
            x="128"
            y="310"
            width="11"
            height="4"/>

        <rect
            x="100"
            y="355"
            width="11"
            height="4"/>

        <rect
            x="225"
            y="250"
            width="12"
            height="4"/>

        <rect
            x="258"
            y="290"
            width="12"
            height="4"/>

        <rect
            x="225"
            y="335"
            width="12"
            height="4"/>

        <rect
            x="258"
            y="375"
            width="12"
            height="4"/>

        <rect
            x="365"
            y="270"
            width="11"
            height="4"/>

        <rect
            x="395"
            y="310"
            width="11"
            height="4"/>

        <rect
            x="365"
            y="355"
            width="11"
            height="4"/>

    </g>


    <!-- ДОРОГА -->

    <path
        d="M205 512
           L235 355
           L277 355
           L315 512
           Z"
        fill="#04060b"/>


    <!-- РАЗМЕТКА -->

    <path
        d="M256 365
           L256 512"

        stroke="#55ddff"

        stroke-width="5"

        stroke-dasharray="22 18"

        opacity=".8"

        filter="url(#smallGlow)"/>


    <!-- ЦИФРА 2 -->

    <text
        x="256"
        y="205"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="150"

        font-weight="900"

        fill="url(#neon)"

        filter="url(#glow)">

        2

    </text>


    <!-- TWO CITIES -->

    <text
        x="256"
        y="285"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="38"

        font-weight="900"

        letter-spacing="2"

        fill="white">

        TWO CITIES

    </text>


    <!-- RUSSIA -->

    <text
        x="256"
        y="325"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="25"

        font-weight="900"

        letter-spacing="8"

        fill="#67ddff"

        filter="url(#smallGlow)">

        RUSSIA

    </text>


    <!-- ЛИНИЯ -->

    <line
        x1="90"
        y1="350"
        x2="422"
        y2="350"

        stroke="url(#neon)"

        stroke-width="3"

        filter="url(#smallGlow)"/>


    <!-- ГОРОДА -->

    <text
        x="256"
        y="385"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="14"

        font-weight="600"

        letter-spacing="3"

        fill="#ffffff">

        MOSCOW • KRASNODAR

    </text>


    <!-- РАМКА -->

    <rect
        x="9"
        y="9"
        width="494"
        height="494"
        rx="102"

        fill="none"

        stroke="url(#neon)"

        stroke-width="3"

        opacity=".5"/>

</svg>