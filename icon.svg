<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

    <!-- Фон -->
    <radialGradient id="bg" cx="35%" cy="25%">
        <stop offset="0%" stop-color="#42baff"/>
        <stop offset="45%" stop-color="#1689ee"/>
        <stop offset="100%" stop-color="#034baf"/>
    </radialGradient>

    <!-- Шерсть -->
    <radialGradient id="fur" cx="35%" cy="25%">
        <stop offset="0%" stop-color="#fff4dc"/>
        <stop offset="35%" stop-color="#e9d3b2"/>
        <stop offset="70%" stop-color="#a98f78"/>
        <stop offset="100%" stop-color="#66584e"/>
    </radialGradient>

    <!-- Светлая мордочка -->
    <radialGradient id="face">
        <stop offset="0%" stop-color="#fff9ee"/>
        <stop offset="100%" stop-color="#dfc6a4"/>
    </radialGradient>

    <!-- Золото -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff4a3"/>
        <stop offset="25%" stop-color="#ffd94d"/>
        <stop offset="60%" stop-color="#eaa21c"/>
        <stop offset="100%" stop-color="#9c5900"/>
    </linearGradient>

    <!-- Глаза -->
    <radialGradient id="eye">
        <stop offset="0%" stop-color="#baf2ff"/>
        <stop offset="35%" stop-color="#28c0ff"/>
        <stop offset="75%" stop-color="#087bdc"/>
        <stop offset="100%" stop-color="#034c9b"/>
    </radialGradient>

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

        <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="10"
            flood-color="#001b48"
            flood-opacity=".45"/>

    </filter>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="16"/>

    </filter>

    <clipPath id="circle">
        <circle
            cx="256"
            cy="256"
            r="246"/>
    </clipPath>

</defs>


<!-- КРУГЛЫЙ ФОН -->

<circle
    cx="256"
    cy="256"
    r="246"
    fill="url(#bg)"/>


<!-- МЯГКОЕ СВЕЧЕНИЕ -->

