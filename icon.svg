<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

  <!-- простой тёмный фон -->
  <linearGradient id="bg"
    x1="0"
    y1="0"
    x2="1"
    y2="1">
    <stop offset="0%" stop-color="#3a3a3a"/>
    <stop offset="50%" stop-color="#242424"/>
    <stop offset="100%" stop-color="#111111"/>
  </linearGradient>

  <!-- объём буквы -->
  <linearGradient id="letter"
    x1="0"
    y1="0"
    x2="0"
    y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="45%" stop-color="#f4f4f4"/>
    <stop offset="100%" stop-color="#bdbdbd"/>
  </linearGradient>

  <!-- мягкая тень -->
  <filter id="shadow"
    x="-30%"
    y="-30%"
    width="160%"
    height="160%">

    <feDropShadow
      dx="0"
      dy="12"
      stdDeviation="10"
      flood-color="#000000"
      flood-opacity=".55"/>

  </filter>

</defs>


<!-- ФОН -->

<rect
  width="512"
  height="512"
  rx="35"
  fill="url(#bg)"
/>


<!-- БУКВА A -->

<path
  d="
    M256 82

    L105 430

    L178 430

    L211 348

    L301 348

    L334 430

    L407 430

    Z

    M256 190

    L282 295

    L230 295

    Z
  "

  fill="url(#letter)"
  filter="url(#shadow)"
/>


<!-- лёгкий верхний блик -->

<path
  d="
    M256 82
    L119 414
    L145 414
    L274 104
    Z
  "

  fill="#ffffff"
  opacity=".10"
/>


</svg>