<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#454545"/>
    <stop offset="45%" stop-color="#292929"/>
    <stop offset="100%" stop-color="#080808"/>
  </linearGradient>

  <linearGradient id="a" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#F2F2F2"/>
    <stop offset="75%" stop-color="#D0D0D0"/>
    <stop offset="100%" stop-color="#999999"/>
  </linearGradient>

  <filter id="shadow"
    x="-50%"
    y="-50%"
    width="200%"
    height="200%">

    <feDropShadow
      dx="0"
      dy="12"
      stdDeviation="11"
      flood-color="#000000"
      flood-opacity=".75"/>

  </filter>

</defs>


<!-- ФОН -->

<rect
  width="512"
  height="512"
  rx="110"
  fill="url(#bg)"
/>


<!-- МАЛЕНЬКАЯ ОБЪЁМНАЯ БУКВА A -->

<path
  d="
    M256 125
    L145 395
    L205 395
    L230 325
    L282 325
    L307 395
    L367 395
    Z

    M256 205
    L272 278
    L240 278
    Z
  "
  transform="translate(0 9)"
  fill="#666666"
/>


<!-- ОСНОВНАЯ БУКВА -->

<path
  d="
    M256 125
    L145 395
    L205 395
    L230 325
    L282 325
    L307 395
    L367 395
    Z

    M256 205
    L272 278
    L240 278
    Z
  "
  fill="url(#a)"
  filter="url(#shadow)"
/>


<!-- МЯГКИЙ БЛИК НА БУКВЕ -->

<path
  d="
    M256 130
    L158 380
    L178 380
    L266 160
    Z
  "
  fill="#FFFFFF"
  opacity=".18"
/>

</svg>